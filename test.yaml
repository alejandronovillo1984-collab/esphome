# Configuración de los relés
switch:
  - platform: gpio
    name: "R2- Luces"
    pin: GPIO16
    restore_mode: RESTORE_DEFAULT_ON
    id: relay_luces
    inverted: true
  - platform: gpio
    name: "R1- Etapa Final "
    pin: GPIO17
    id: relay_etapaFinal
    inverted: true
  - platform: gpio
    name: "R3- Etapa Plantin"
    pin: GPIO18
    inverted: true
    id: relay_etapaPlantin
  - platform: gpio
    name: "R4- Etapa Inicial"
    pin: GPIO19
    id: relay_etapaInicial
    inverted: true
  - platform: template
    name: "CONFIG/RUTINA R3- Plantin (15min x 1hr DIA, 15min x 2 hr NOCHE)"
    restore_mode: RESTORE_DEFAULT_ON
    id: switch_rutina_plantines
    optimistic: true
    turn_on_action:
      - globals.set:
          id: rutina_plantines_activa
          value: "true"
      - logger.log: "Rutina Plantines activada"
    turn_off_action:
      - globals.set:
          id: rutina_plantines_activa
          value: "false"
      - logger.log: "Rutina Plantines desactivada"

  - platform: template
    name: "CONFIG/RUTINA R1- Final (15min x 1hr DIA, 15min x 2hr NOCHE) "
    id: switch_rutina_final
    restore_mode: RESTORE_DEFAULT_ON
    optimistic: true
    icon: "mdi:cog"
    turn_on_action:
      - globals.set:
          id: rutina_final_activa
          value: "true"
      - logger.log: "Rutina Final activada"
    turn_off_action:
      - globals.set:
          id: rutina_final_activa
          value: "false"
      - logger.log: "Rutina Final desactivada"
  - platform: template
    name: "CONFIG/RUTINA R4- Inicial (9 y 19hrs)"
    restore_mode: RESTORE_DEFAULT_ON
    id: switch_rutina_inicial
    optimistic: true
    turn_on_action:
      - globals.set:
          id: rutina_inicial_activa
          value: "true"
      - logger.log: "Rutina Inicial activada"
    turn_off_action:
      - globals.set:
          id: rutina_inicial_activa
          value: "false"
      - logger.log: "Rutina Inicial desactivada"
  - platform: template
    name: "CONFIG/RUTINA R2- Luces (7 a 20 hrs)"
    id: switch_rutina_luces
    restore_mode: RESTORE_DEFAULT_ON
    optimistic: true
    turn_on_action:
      - globals.set:
          id: rutina_luces_activa
          value: "true"
      - logger.log: "Rutina Luces activada"
    turn_off_action:
      - globals.set:
          id: rutina_luces_activa
          value: "false"
      - logger.log: "Rutina Luces desactivada"
# Configuración de WireGuard para conectarse al servidor VPN
# wireguard:
