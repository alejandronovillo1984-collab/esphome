time:
  - platform: sntp
    id: esphome_time
    timezone: America/Argentina/Buenos_Aires
    servers: "pool.ntp.org"
    update_interval: 60s
    on_time:
      #//////////////////////////////////LUCES ////////////////////////////////////////////////////////////////
      #////////////////////////////////////////////////////////////////////////////////////////////////////////
      - seconds: 0
        minutes: 0
        hours: 7
        then:
          - if:
              condition:
                lambda: "return id(rutina_luces_activa) == true;"
              then:
                - switch.turn_on: relay_luces
                - logger.log: "R2 Enciendo luces"

      - seconds: 0
        minutes: 0
        hours: 20
        then:
          - if:
              condition:
                lambda: "return id(rutina_luces_activa) == true;"
              then:
                - switch.turn_off: relay_luces
                - logger.log: "R2 Apago luces"

      #//////////////////////////////////ETAPA INICIAL////////////////////////////////////////////////////////////
      #////////////////////////////////////////////////////////////////////////////////////////////////////////

      # Etapa Inicial (R4): RIEGO 1 a las 9 HORAS
      - seconds: 0
        minutes: 0
        hours: 9
        then:
          - if:
              condition:
                lambda: "return id(rutina_inicial_activa) == true;"
              then:
                - switch.turn_on: relay_etapaInicial
                - logger.log: "R4 encendido (Etapa Inicial )"
                - delay: 20s
                - switch.turn_off: relay_etapaInicial
                - logger.log: "R4 apagado (Etapa Inicial )"
      # Etapa Inicial (R4): RIEGO 2 a las 14 HORAS
      # - seconds: 0
      #   minutes: 0
      #   hours: 14
      #   then:
      #       - if:
      #           condition:
      #             lambda: 'return id(rutina_inicial_activa) == true;'
      #           then:
      #             - switch.turn_on: relay_etapaInicial
      #             - logger.log: "R4 encendido (Etapa Inicial )"
      #             - delay: 20s
      #             - switch.turn_off: relay_etapaInicial
      #             - logger.log: "R4 apagado (Etapa Inicial )"

      # Etapa Inicial (R4): RIEGO a las 19 HORAS
      - seconds: 0
        minutes: 0
        hours: 19
        then:
          - if:
              condition:
                lambda: "return id(rutina_inicial_activa) == true;"
              then:
                - switch.turn_on: relay_etapaInicial
                - logger.log: "R4 encendido (Etapa Inicial )"
                - delay: 20s
                - switch.turn_off: relay_etapaInicial
                - logger.log: "R4 apagado (Etapa Inicial )"

      # Etapa Inicial (R4): Horas de oscuridad (15 min encendido, 1h30 apagado)
      # - seconds: 0
      #   minutes: /480
      #   hours: 20-6
      #   then:
      #       - if:
      #           condition:
      #             lambda: 'return id(rutina_inicial_activa) == true;'
      #           then:
      #             - switch.turn_on: relay_etapaInicial
      #             - logger.log: "R4 encendido (Etapa Inicial - Oscuridad)"
      #             - delay: 15s
      #             - switch.turn_off: relay_etapaInicial
      #             - logger.log: "R4 apagado (Etapa Inicial - Oscuridad)"
      #//////////////////////////////////ETAPA FINAL////////////////////////////////////////////////////////////
      #////////////////////////////////////////////////////////////////////////////////////////////////////////
      # Etapa Final (R1): Horas de sol (15 min encendido, 15 min apagado)
      - seconds: 0
        minutes: /45
        hours: 7-19
        then:
          - if:
              condition:
                lambda: "return id(rutina_final_activa) == true;"
              then:
                - switch.turn_on: relay_etapaFinal
                - logger.log: "R1 encendido (Etapa Final Dos - Sol)"
                - delay: 15min
                - switch.turn_off: relay_etapaFinal
                - logger.log: "R1 apagado (Etapa Final Dos - Sol)"

      # Etapa Final (R1): Horas de oscuridad (15 min encendido, 1h30 apagado)
      - seconds: 0
        minutes: /120
        hours: 20-6
        then:
          - if:
              condition:
                lambda: "return id(rutina_final_activa) == true;"
              then:
                - switch.turn_on: relay_etapaFinal
                - logger.log: "R1 encendido (Etapa Final - Oscuridad)"
                - delay: 15min
                - switch.turn_off: relay_etapaFinal
                - logger.log: "R1 apagado (Etapa Final - Oscuridad)"
      #//////////////////////////////////PLANTIN////////////////////////////////////////////////////////////
      #////////////////////////////////////////////////////////////////////////////////////////////////////////
      # Etapa Plantin Dos (R3): Horas de sol (15 min encendido, 15 min apagado)
      - seconds: 0
        minutes: /45
        hours: 7-19
        then:
          - if:
              condition:
                lambda: "return id(rutina_plantines_activa) == true;"
              then:
                - switch.turn_on: relay_etapaPlantin
                - logger.log: "R3 encendido (Rutina activa)"
                - delay: 15min
                - switch.turn_off: relay_etapaPlantin
                - logger.log: "R3 apagado (Rutina activa)"
              else:
                - logger.log: "Rutina Plantines desactivada, no se enciende el relé"
      # Etapa Plantin Dos (R3): Horas de oscuridad (15 min encendido, 1h30 apagado)
      - seconds: 0
        minutes: /120
        hours: 20-6
        then:
          - if:
              condition:
                lambda: "return id(rutina_plantines_activa) == true;"
              then:
                - switch.turn_on: relay_etapaPlantin
                - logger.log: "R3 encendido (Etapa Plantin Dos - Oscuridad)"
                - delay: 15min
                - switch.turn_off: relay_etapaPlantin
                - logger.log: "R3 apagado (Etapa Plantin Dos - Oscuridad)"
