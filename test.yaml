globals:
  - id: rutina_plantines_activa
    type: bool
    restore_value: True
  - id: rutina_luces_activa
    type: bool
    restore_value: True
  - id: rutina_final_activa
    type: bool
    restore_value: True
  - id: rutina_inicial_activa
    type: bool
    restore_value: True
  - id: current_temperature
    type: float
    restore_value: false
    initial_value: "0.0"
