    red: 100%
    green: 100%
    blue: 100%
  - id: red
    red: 100%
    green: 0%
    blue: 0%
  - id: green
    red: 0%
    green: 100%
    blue: 0%
  - id: blue
    red: 0%
    green: 0%
    blue: 100%
  - id: yellow
    red: 100%
    green: 100%
    blue: 0%

# Switches and Controls
switch:
  # Power (Display & GNSS)
  - platform: gpio
    id: power
    name: "Power (Display & GNSS)"
    restore_mode: RESTORE_DEFAULT_OFF
    pin:
      number: GPIO3
      inverted: true
      mode:
        output: true
        pulldown: true
  # Display status
  - platform: gpio
    id: display_status
    name: "Display Status"
    restore_mode: RESTORE_DEFAULT_ON
    pin:
      number: GPIO21
      mode: OUTPUT
  # Charge Control
  - platform: gpio
    id: charge_control
    name: "Charge Control"
    restore_mode: RESTORE_DEFAULT_ON
    pin:
      number: GPIO2
      mode: OUTPUT

  # Habilitar/Deshabilitar GPS (Hardware reset para bajo consumo)
  - platform: template
    name: "GPS Habilitado"
    id: gps_enabled
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    turn_on_action:
      - output.turn_off: gnss_rst_output # Libera reset (enciende GNSS)
      - logger.log: "GNSS Hardware Activado"
    turn_off_action:
      - output.turn_on: gnss_rst_output # Mantiene reset (apaga GNSS)
      - logger.log: "GNSS Hardware Desactivado"

  # Modo Gateway (Enlaza LoRa con MQTT si está ON)
  - platform: template
    name: "Modo Gateway LoRa-MQTT"
    id: gateway_mode
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    turn_on_action:
      - if:
          condition:
            lambda: 'return id(boot_finished);'
          then:
            - mqtt.enable:
            - logger.log: "Gateway MQTT Activado"
    turn_off_action:
      - if:
          condition:
            lambda: 'return id(boot_finished);'
          then:
            - mqtt.disable:
            - logger.log: "Gateway MQTT Desactivado"

# Sensors
sensor:
  # Uptime
  - platform: uptime
    id: last_boot
    type: timestamp
    name: "Last Boot (Uptime)"

  # Battery Voltage
  - platform: adc
    id: bat_voltage
    name: "BAT Voltage"
    pin: GPIO1
    attenuation: 12db
    accuracy_decimals: 3
    samples: 3
    update_interval: 1min
    filters:
      - multiply: 4.8837

  # LoRa Link Quality – último paquete recibido
  - platform: template
    id: lora_rssi
    name: "LoRa RSSI"
    unit_of_measurement: "dBm"
    accuracy_decimals: 1
    icon: "mdi:signal"
    update_interval: never

  - platform: template
    id: lora_snr
    name: "LoRa SNR"
    unit_of_measurement: "dB"
    accuracy_decimals: 1
    icon: "mdi:sine-wave"
    update_interval: never

# LoRa Module (SX1262)
sx126x:
  id: sx_module
  spi_id: spi_sx126x
  hw_version: sx1262
  cs_pin: GPIO8 # LoRa_NSS
  rst_pin: GPIO12 # LoRa_RST
  busy_pin: GPIO13 # LoRa_BUSY
  dio1_pin: GPIO14 # DIO1
  frequency: 863000000
  modulation: LORA
  rf_switch: true
  pa_power: 3
  tcxo_voltage: 1_7V
  crc_enable: true
  on_packet:
    then:
      - lambda: |-
          using namespace lora_custom;
          ESP_LOGD("lora_rx", "Paquete recibido (%d bytes) RSSI:%.1f SNR:%.1f",
                   (int)x.size(), rssi, snr);

          // Actualizar sensores de calidad de enlace LoRa
          id(lora_rssi).publish_state(rssi);
          id(lora_snr).publish_state(snr);

          if (!is_valid_packet(x)) {
            ESP_LOGW("lora_rx", "Paquete con magic desconocido, ignorado.");
            return;
          }

          uint8_t cmd = x[2];

          // ── Telemetría de la Compuerta u otro nodo ──────────────────────────
          if (cmd == CMD_TELEMETRY && x.size() >= 30) {
            float rem_lat  = pop_float(x, 3);
            float rem_lon  = pop_float(x, 7);
            float rem_bat  = pop_float(x, 11);
            float rem_food = pop_float(x, 15);
            uint8_t rem_gps   = x[23];
            uint8_t rem_cycle = x[24];
            uint8_t rem_gate  = x[25];
            uint8_t rem_type  = x[26];

            // Extraer campos adicionales si el paquete es extendido
            float rem_bocina_secs = 0.0f;
            float rem_time_left = 0.0f;
            float rem_tiempo_apertura = 0.0f;
            float rem_altura_repositorio = 0.0f;
            uint8_t rem_display_status = 0;
            uint8_t rem_power_status = 0;
            std::string rem_horarios = "";

            if (x.size() >= 38) {
              rem_bocina_secs = pop_float(x, 30);
              rem_time_left = pop_float(x, 34);
            }
            if (x.size() >= 48) {
              rem_tiempo_apertura = pop_float(x, 38);
              rem_altura_repositorio = pop_float(x, 42);
              rem_display_status = x[46];
              rem_power_status = x[47];
            }
            if (x.size() > 48) {
              rem_horarios = std::string(x.begin() + 48, x.end());
            }

            // Obtener el identificador del dispositivo emisor a partir del MAC suffix (3 bytes)
            char dev_id[7];
            snprintf(dev_id, sizeof(dev_id), "%02x%02x%02x", x[27], x[28], x[29]);

            std::string cycle_str = "INACTIVA";
            if (rem_cycle == 1) cycle_str = "BOCINA";
            else if (rem_cycle == 2) cycle_str = "ABRIENDO";
            else if (rem_cycle == 3) cycle_str = "ALIMENTANDO";
            else if (rem_cycle == 4) cycle_str = "CERRANDO";

            ESP_LOGI("lora_rx", "Telemetría de [%s] (%s): lat=%.4f lon=%.4f bat=%.2fV food=%.0f%% gps=%d cycle=%s gate=%d bocina_s=%.1f rem_min=%.1f ap_min=%.1f alt=%.1fcm disp=%d pwr=%d sched=%s",
                     dev_id, (rem_type == 1) ? "Compuerta" : "Repetidor", rem_lat, rem_lon, rem_bat, rem_food, rem_gps, cycle_str.c_str(), rem_gate, rem_bocina_secs, rem_time_left, rem_tiempo_apertura, rem_altura_repositorio, rem_display_status, rem_power_status, rem_horarios.c_str());

            auto& devices = lora_custom::get_last_seen_devices();
            bool was_online = false;
            if (devices.find(dev_id) != devices.end()) {
              was_online = devices[dev_id].online;
            }

            lora_custom::DeviceInfo info;
            info.last_seen_time = millis() / 1000;
            info.type = rem_type;
            info.food_pct = rem_food;
            info.routine_state = cycle_str;
            info.online = true;
            devices[dev_id] = info;

            // Si somos gateway y MQTT está conectado, publicamos!
            if (id(gateway_mode).state && id(mqtt_client).is_connected()) {
              // Publicar estado ONLINE si antes estaba offline
              if (!was_online) {
                char status_topic[64];
                snprintf(status_topic, sizeof(status_topic), "%s/status", dev_id);
                id(mqtt_client).publish(status_topic, std::string("online"), 0, true);
                ESP_LOGI("mqtt_gateway", "Publicado estado ONLINE [%s]: online", status_topic);
              }

              char topic[64];
              snprintf(topic, sizeof(topic), "%s/telemetry", dev_id);

              std::string type_str = (rem_type == 1) ? "compuerta" : "repetidor";

              char payload[600];
              snprintf(payload, sizeof(payload),
                       "{\"device_id\":\"%s\",\"device_type\":\"%s\",\"latitude\":%.6f,\"longitude\":%.6f,\"battery\":%.3f,\"food_percentage\":%.1f,\"gps_enabled\":%d,\"routine_state\":\"%s\",\"gate_state\":%d,\"bocina_seconds\":%.1f,\"time_left_alimenta\":%.1f,\"tiempo_apertura_min\":%.1f,\"altura_repositorio\":%.1f,\"display_status\":%d,\"power_status\":%d,\"horarios\":\"%s\",\"lora_rssi\":%.1f,\"lora_snr\":%.1f}",
                       dev_id, type_str.c_str(), 
                       std::isnan(rem_lat) ? 0.0 : rem_lat, 
                       std::isnan(rem_lon) ? 0.0 : rem_lon, 
                       std::isnan(rem_bat) ? 0.0 : rem_bat, 
                       std::isnan(rem_food) ? 0.0 : rem_food, 
                       rem_gps, cycle_str.c_str(), rem_gate, 
                       std::isnan(rem_bocina_secs) ? 0.0 : rem_bocina_secs, 
                       std::isnan(rem_time_left) ? 0.0 : rem_time_left,
                       std::isnan(rem_tiempo_apertura) ? 0.0 : rem_tiempo_apertura,
                       std::isnan(rem_altura_repositorio) ? 0.0 : rem_altura_repositorio,
                       rem_display_status, rem_power_status,
                       rem_horarios.c_str(),
                       rssi, snr);
              
              id(mqtt_client).publish(topic, payload);
              ESP_LOGI("mqtt_gateway", "Publicado en MQTT [%s]: %s", topic, payload);

            } else if (id(gateway_mode).state) {

              ESP_LOGD("mqtt_gateway", "MQTT no conectado, telemetría de %s no publicada", dev_id);
            }

            // Repetir el paquete para ampliar cobertura (anti-loop incluido)
            if (should_repeat(x)) {
              id(sx_module).transmit_packet(x);
              ESP_LOGI("repeater", "Telemetría de compuerta repetida.");
            }
            return;
          }

          // ── Comandos de control (el repetidor los reenvía hacia la compuerta) ──
          if (cmd != CMD_TELEMETRY) {
            if (should_repeat(x)) {
              id(sx_module).transmit_packet(x);
              ESP_LOGI("repeater", "Comando 0x%02X repetido hacia la compuerta.", cmd);
            }
            return;
          }

          ESP_LOGW("lora_rx", "CMD desconocido: 0x%02X", cmd);

# GNSS UART
uart:
  id: uart_gnss
  tx_pin: GPIO34 # GNSS_RX
  rx_pin: GPIO33 # GNSS_TX
  baud_rate: 115200

# GPS Component
gps:
  latitude:
    name: "Latitude"
    id: htit_gnss_latitude
  longitude:
    name: "Longitude"
    id: htit_gnss_longitude
  altitude:
    name: "Altitude"
    id: htit_gnss_altitude
  speed:
    name: "Speed"
    id: htit_gnss_speed
  course:
    name: "Course"
    id: htit_gnss_course
  satellites:
    name: "Satellites"
    id: htit_gnss_satellites
  hdop:
    name: "HDOP"
    id: htit_gnss_hdop
  update_interval: 5s

# Buttons
button:
  - platform: restart
    name: "Restart"
  - platform: shutdown
    name: "Shutdown"
  - platform: safe_mode
    name: "Safe Mode Boot"
  - platform: output
    id: reset_gnss
    name: "Reset GNSS"
    output: gnss_rst_output
    duration: 1ms
    entity_category: config
  - platform: template
    name: "Test LoRa TX"
    icon: "mdi:radio-tower"
    on_press:
      then:
        - lambda: |-
            using namespace lora_custom;
            // Envia un paquete de prueba (ping) con magic correcto
            std::vector<uint8_t> pkt = {LORA_MAGIC_0, LORA_MAGIC_1, 0xFF};
            id(sx_module).transmit_packet(pkt);
            ESP_LOGI("test", "Paquete de prueba enviado.");

# User button
binary_sensor:
  - platform: gpio
    id: user_button
    name: "USER Button"
    pin:
      number: GPIO0
      mode: INPUT_PULLUP
      inverted: true
    on_press:
      - if:
          condition:
            wifi.enabled:
          then:
            - wifi.disable:
            - lambda: |-
                id(wifi_is_enabled) = false;
            - logger.log: "WiFi Deshabilitado por Botón Físico"
          else:
            - wifi.enable:
            - lambda: |-
                id(wifi_is_enabled) = true;
            - logger.log: "WiFi Habilitado por Botón Físico"

# packet_transport eliminado: ahora usamos protocolo LoRa custom (0xAB/0xCD)

# Text Sensors (WiFi info)
text_sensor:
  - platform: wifi_info
    ip_address:
      name: "IP Address"
      id: wifi_ip
    ssid:
      name: "SSID"
      id: wifi_ssid_sensor
