substitutions:
  name: "repeater-gateway"
  friendly_name: "Repeater Gateway"
  zona_horaria: "America/Argentina/Buenos_Aires"
  mqtt_host: "mqtt.hidroponiacentenario.com.ar"
  mqtt_port: "1883"
  mqtt_user: "alejandro"
  mqtt_pass: "piteroski1984"
  device_mac: "e5b854"  # Últimos 3 bytes del MAC WiFi – sufijo del gateway

preferences:
  flash_write_interval: 10s

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  name_add_mac_suffix: true
  includes:
    - lora_helpers.h
  on_boot:
    - priority: 950.0
      then:
        - lambda: |-
            uint8_t mac[6];
            esp_read_mac(mac, ESP_MAC_WIFI_STA);
            char mac_str[7];
            snprintf(mac_str, sizeof(mac_str), "%02x%02x%02x", mac[3], mac[4], mac[5]);
            if (global_mqtt_client != nullptr) {
              global_mqtt_client->set_topic_prefix(std::string(mac_str), std::string(mac_str));
              ESP_LOGI("mqtt", "MQTT topic prefix set dynamically to: %s", mac_str);
            }
    - priority: 900.0
      then:
        - switch.turn_on: display_status
    - priority: -100.0
      then:
        - delay: 500ms
        - button.press: reset_gnss
        - if:
            condition:
              not:
                switch.is_on: gateway_mode
            then:
              - mqtt.disable:
        - lambda: |-
            id(boot_finished) = true;
            ESP_LOGI("boot", "Arranque completo. Control de acciones de restauración liberado.");

globals:
  - id: wifi_is_enabled
    type: bool
    restore_value: false
    initial_value: "true"
  - id: boot_finished
    type: bool
    restore_value: false
    initial_value: "false"

