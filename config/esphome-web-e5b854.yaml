captive_portal:

web_server:
  port: 80

mqtt:
  id: mqtt_client
  broker: ${mqtt_host}
  port: ${mqtt_port}
  username: ${mqtt_user}
  password: ${mqtt_pass}
  reboot_timeout: 0s
  topic_prefix: ${device_mac}
  # Birth/LWT explícitos → siempre van al topic correcto sin importar set_topic_prefix
  birth_message:
    topic: "${device_mac}/status"
    payload: "online"
    retain: true
  will_message:
    topic: "${device_mac}/status"
    payload: "offline"
    retain: true
  on_connect:
    then:
      - lambda: |-
          // Al conectar/reconectar a MQTT, reseteamos la bandera online local de todos los dispositivos
          // para forzar la re-publicación de su estado online actual en el Broker.
          for (auto &d : lora_custom::get_last_seen_devices()) {
            d.second.online = false;
          }

          // Limpiar topics viejos (stale retained offline/state) de la dirección vieja
          if (global_mqtt_client != nullptr) {
            global_mqtt_client->publish("repeater-gateway-e5b854/status", std::string(""), 0, true);
            global_mqtt_client->publish("repeater-gateway-e5b854/sensor/last_boot_uptime/state", std::string(""), 0, true);
            global_mqtt_client->publish("repeater-gateway-e5b854/sensor/bat_voltage/state", std::string(""), 0, true);
            global_mqtt_client->publish("repeater-gateway-e5b854/sensor/lora_rssi/state", std::string(""), 0, true);
            global_mqtt_client->publish("repeater-gateway-e5b854/sensor/lora_snr/state", std::string(""), 0, true);
            global_mqtt_client->publish("repeater-gateway-e5b854/sensor/latitude/state", std::string(""), 0, true);
            global_mqtt_client->publish("repeater-gateway-e5b854/sensor/longitude/state", std::string(""), 0, true);
            global_mqtt_client->publish("repeater-gateway-e5b854/sensor/altitude/state", std::string(""), 0, true);
            global_mqtt_client->publish("repeater-gateway-e5b854/sensor/speed/state", std::string(""), 0, true);
            global_mqtt_client->publish("repeater-gateway-e5b854/sensor/course/state", std::string(""), 0, true);
            global_mqtt_client->publish("repeater-gateway-e5b854/sensor/satellites/state", std::string(""), 0, true);
            global_mqtt_client->publish("repeater-gateway-e5b854/sensor/hdop/state", std::string(""), 0, true);
            global_mqtt_client->publish("repeater-gateway-e5b854/text_sensor/ip_address/state", std::string(""), 0, true);
            global_mqtt_client->publish("repeater-gateway-e5b854/text_sensor/ssid/state", std::string(""), 0, true);
            global_mqtt_client->publish("repeater-gateway-e5b854/switch/power_display_gnss/state", std::string(""), 0, true);
            global_mqtt_client->publish("repeater-gateway-e5b854/switch/display_status/state", std::string(""), 0, true);
            global_mqtt_client->publish("repeater-gateway-e5b854/switch/charge_control/state", std::string(""), 0, true);
            global_mqtt_client->publish("repeater-gateway-e5b854/switch/gps_habilitado/state", std::string(""), 0, true);
            global_mqtt_client->publish("repeater-gateway-e5b854/switch/modo_gateway_lora_mqtt/state", std::string(""), 0, true);
            global_mqtt_client->publish("repeater-gateway-e5b854/light/led/state", std::string(""), 0, true);
            global_mqtt_client->publish("repeater-gateway-e5b854/binary_sensor/user_button/state", std::string(""), 0, true);
          }

          static bool already_subscribed = false;
          if (!already_subscribed && global_mqtt_client != nullptr) {
            global_mqtt_client->subscribe("+/command/+", [](const std::string &topic, const std::string &payload) {
              if (!id(gateway_mode).state) return;
              using namespace lora_custom;
              
              size_t slash1 = topic.find('/');
              if (slash1 == std::string::npos) return;
              std::string dev_id = topic.substr(0, slash1);
              
              size_t slash2 = topic.find('/', slash1 + 1);
              if (slash2 == std::string::npos) return;
              std::string action = topic.substr(slash2 + 1);
              
              ESP_LOGI("mqtt_gateway", "Comando recibido: device=%s, action=%s, payload=%s", 
                       dev_id.c_str(), action.c_str(), payload.c_str());
                       
              uint8_t target_mac[3];
              if (dev_id == "ffffff" || dev_id == "FFFFFF" || dev_id == "broadcast") {
                target_mac[0] = 0xFF;
                target_mac[1] = 0xFF;
                target_mac[2] = 0xFF;
              } else {
                unsigned int m0, m1, m2;
                if (sscanf(dev_id.c_str(), "%02x%02x%02x", &m0, &m1, &m2) != 3) {
                  ESP_LOGW("mqtt_gateway", "ID de dispositivo inválido: %s", dev_id.c_str());
                  return;
                }
                target_mac[0] = (uint8_t)m0;
                target_mac[1] = (uint8_t)m1;
                target_mac[2] = (uint8_t)m2;
              }
              
              std::vector<uint8_t> pkt;
              pkt.push_back(LORA_MAGIC_0);
              pkt.push_back(LORA_MAGIC_1);
              pkt.push_back(target_mac[0]);
              pkt.push_back(target_mac[1]);
              pkt.push_back(target_mac[2]);
              
              if (action == "horarios") {
                pkt.push_back(CMD_SET_SCHEDULE);
                pkt.insert(pkt.end(), payload.begin(), payload.end());
                ESP_LOGI("mqtt_gateway", "Fwd: SET_SCHEDULE '%s' to %s", payload.c_str(), dev_id.c_str());
              } 
              else if (action == "tiempo_apertura") {
                char* endptr = nullptr;
                float val = std::strtof(payload.c_str(), &endptr);
                if (endptr != payload.c_str() && *endptr == '\0') {
                  pkt.push_back(CMD_SET_FOOD_SECS);
                  push_float(pkt, val);
                  ESP_LOGI("mqtt_gateway", "Fwd: SET_FOOD_MINS '%.1fmin' to %s", val, dev_id.c_str());
                } else {
                  ESP_LOGW("mqtt_gateway", "Valor inválido para tiempo_apertura: %s", payload.c_str());
                  return;
                }
              } 
              else if (action == "segundos_bocina") {
                char* endptr = nullptr;
                float val = std::strtof(payload.c_str(), &endptr);
                if (endptr != payload.c_str() && *endptr == '\0') {
                  pkt.push_back(CMD_SET_BOCINA_SECS);
                  push_float(pkt, val);
                  ESP_LOGI("mqtt_gateway", "Fwd: SET_BOCINA_SECS '%.1fs' to %s", val, dev_id.c_str());
                } else {
                  ESP_LOGW("mqtt_gateway", "Valor inválido para segundos_bocina: %s", payload.c_str());
                  return;
                }
              }
              else if (action == "altura_repositorio") {
                char* endptr = nullptr;
                float val = std::strtof(payload.c_str(), &endptr);
                if (endptr != payload.c_str() && *endptr == '\0') {
                  pkt.push_back(CMD_SET_ALTURA_REPO);
                  push_float(pkt, val);
                  ESP_LOGI("mqtt_gateway", "Fwd: SET_ALTURA_REPO '%.1fcm' to %s", val, dev_id.c_str());
                } else {
                  ESP_LOGW("mqtt_gateway", "Valor inválido para altura_repositorio: %s", payload.c_str());
                  return;
                }
              } 
              else if (action == "rutina") {
                if (payload == "START" || payload == "start" || payload == "1") {
                  pkt.push_back(CMD_FEED_ROUTINE);
                  ESP_LOGI("mqtt_gateway", "Fwd: FEED_ROUTINE to %s", dev_id.c_str());
                } else {
                  ESP_LOGW("mqtt_gateway", "Valor de rutina inválido (debe ser START/1): %s", payload.c_str());
                  return;
                }
              } 
              else if (action == "display_status") {
                pkt.push_back(CMD_SET_DISPLAY);
                uint8_t val = (payload == "ON" || payload == "on" || payload == "1") ? 1 : 0;
                pkt.push_back(val);
                ESP_LOGI("mqtt_gateway", "Fwd: SET_DISPLAY '%d' to %s", val, dev_id.c_str());
              } 
              else if (action == "power") {
                pkt.push_back(CMD_SET_POWER);
                uint8_t val = (payload == "ON" || payload == "on" || payload == "1") ? 1 : 0;
                pkt.push_back(val);
                ESP_LOGI("mqtt_gateway", "Fwd: SET_POWER '%d' to %s", val, dev_id.c_str());
              } 
              else {
                ESP_LOGW("mqtt_gateway", "Acción de comando desconocida: %s", action.c_str());
                return;
              }
              lora_custom::enqueue_packet(pkt);
            });
            already_subscribed = true;
          }

# ── LoRa Telemetría propia del Repetidor (cada 60 s) ─────────────────────
# Transmite su posición GPS y batería por radio para que la red lo detecte.
interval:
  # Descola y transmite comandos MQTT hacia LoRa de forma segura en el hilo principal (evita colisiones SPI)
  - interval: 50ms
    then:
      - lambda: |-
          using namespace lora_custom;
          std::vector<uint8_t> pkt;
          while (dequeue_packet(pkt)) {
            id(sx_module).transmit_packet(pkt);
            ESP_LOGI("mqtt_gateway", "Comando descolado y transmitido por LoRa (%d bytes)", (int)pkt.size());
          }
  # Chequeo periódico de estado Online/Offline de dispositivos de la red LoRa (cada 30 s)
  - interval: 30s
    then:
      - lambda: |-
          using namespace lora_custom;
          uint32_t now_secs = millis() / 1000;
          for (auto &d : get_last_seen_devices()) {
            if (d.second.online && (now_secs - d.second.last_seen_time >= 300)) {
              d.second.online = false;
              ESP_LOGW("mqtt_gateway", "Dispositivo [%s] detectado OFFLINE (inactividad > 5 min)", d.first.c_str());
              
              if (id(gateway_mode).state && id(mqtt_client).is_connected()) {
                char status_topic[64];
                snprintf(status_topic, sizeof(status_topic), "%s/status", d.first.c_str());
                id(mqtt_client).publish(status_topic, std::string("offline"), 0, true);
                ESP_LOGI("mqtt_gateway", "Publicado estado OFFLINE [%s]: offline", status_topic);
              }
            }
          }
  - interval: 60s
    then:
      - lambda: |-
          using namespace lora_custom;
          std::vector<uint8_t> pkt;

          pkt.push_back(LORA_MAGIC_0);
          pkt.push_back(LORA_MAGIC_1);
          pkt.push_back(CMD_TELEMETRY);

          push_float(pkt, id(htit_gnss_latitude).state);
          push_float(pkt, id(htit_gnss_longitude).state);
          push_float(pkt, id(bat_voltage).state);

          // El repetidor no tiene comida ni puerta → enviamos NaN/0
          push_float(pkt, std::numeric_limits<float>::quiet_NaN());
          push_float(pkt, std::numeric_limits<float>::quiet_NaN());
          pkt.push_back(id(gps_enabled).state ? 1 : 0); // index 23
          pkt.push_back(0); // routine_running: N/A, index 24
          pkt.push_back(0); // gate_state: N/A, index 25

          // Tipo de dispositivo (1 byte: 2 = Repetidor)
          pkt.push_back(0x02); // index 26

          // Sufijo único de dirección MAC (3 bytes) para identificar el dispositivo
          uint8_t mac[6];
          esp_read_mac(mac, ESP_MAC_WIFI_STA);
          pkt.push_back(mac[3]); // index 27
          pkt.push_back(mac[4]); // index 28
          pkt.push_back(mac[5]); // index 29

          id(sx_module).transmit_packet(pkt);
          ESP_LOGI("lora_tx", "Telemetría repetidor enviada (%d bytes)", pkt.size());

# https://esphome.io/components/time/
time:
  # https://esphome.io/components/time/homeassistant
  - platform: homeassistant
    id: homeassistant_time
    timezone: ${zona_horaria}
  # https://esphome.io/components/time/gps
  - platform: gps
    id: gnss_time
    timezone: ${zona_horaria}

# Light
output:
  - platform: gpio
    id: light_output
    pin: GPIO18 # LED
  - platform: gpio
    id: gnss_rst_output
    pin: GPIO35 # GNSS_RST
    inverted: true

light:
  - platform: binary
    id: led
    name: "LED"
    output: light_output

# SPI Configuration
spi:
  # Display
  - id: spi_st7735
    clk_pin: GPIO41 # SCLK
    mosi_pin: GPIO42 # SDIN
  # LoRa
  - id: spi_sx126x
    clk_pin: GPIO9 # LoRa_SCK
    mosi_pin: GPIO10 # LoRa_MOSI
    miso_pin: GPIO11 # LoRa_MISO

# Display TFT ST7735
display:
  - platform: ili9xxx
    spi_id: spi_st7735
    model: st7735
    id: st7735
    cs_pin: GPIO38 # CS
    reset_pin: GPIO39 # RES
    dc_pin: GPIO40 # RS
    color_order: bgr
    invert_colors: true
    dimensions:
      width: 160
      height: 80
      offset_width: 1
      offset_height: 26
    transform:
      swap_xy: true
      mirror_y: true
      mirror_x: false
    data_rate: 40MHz
    auto_clear_enabled: true
    lambda: |-
      // Fila 1: Estado WiFi / IP a la izquierda y distintivo a la derecha
      std::string wifi_str = "WiFi: APAGADO";
      Color wifi_color = id(red);
      if (id(wifi_comp).is_connected()) {
        wifi_str = id(wifi_ip).state;
        if (wifi_str.empty() || wifi_str == "0.0.0.0") {
          wifi_str = "Conectando...";
          wifi_color = id(yellow);
        } else {
          wifi_color = id(green);
        }
      } else {
        if (id(wifi_is_enabled)) {
          wifi_str = "Desconectado";
        } else {
          wifi_str = "WiFi: APAGADO";
        }
      }
      it.print(0, 0, id(font_small), wifi_color, wifi_str.c_str());

      bool is_gw = id(gateway_mode).state;
      std::string role_str = is_gw ? "GATEWAY" : "REPETIDOR";
      Color role_color = is_gw ? id(blue) : id(green);
      it.print(160, 0, id(font_small), role_color, TextAlign::TOP_RIGHT, role_str.c_str());

      // Línea divisoria elegante
      it.line(0, 13, 160, 13, id(white));

      // Título de Dispositivos en red
      it.print(0, 18, id(font_small), id(yellow), "DISPOSITIVOS EN RED:");

      // Listado de dispositivos activos en los últimos 10 min
      uint32_t now_secs = millis() / 1000;
      int y_pos = 32;
      // Copiar nodos activos
      std::vector<std::pair<std::string, lora_custom::DeviceInfo>> active_nodes;
      for (auto const &d : lora_custom::get_last_seen_devices()) {
        if (now_secs - d.second.last_seen_time < 600) {
          active_nodes.push_back({d.first, d.second});
        }
      }

      int count = 0;
      for (auto const &d : active_nodes) {
        char buf_dev[48];
        if (d.second.type == 1) { // Compuerta
          // • e5b5a4:95% ALIMENTANDO
          snprintf(buf_dev, sizeof(buf_dev), "• %s:%.0f%% %s", 
                   d.first.c_str(), d.second.food_pct, d.second.routine_state.c_str());
        } else { // Repetidor/Gateway u otros
          std::string type_str = (d.second.type == 2) ? "GW/REP" : "DESC";
          snprintf(buf_dev, sizeof(buf_dev), "• %s:%s", 
                   d.first.c_str(), type_str.c_str());
        }
        it.print(2, y_pos, id(font_small), id(white), buf_dev);
        y_pos += 14;
        count++;
        if (count >= 3) break; // Caben 3 dispositivos cómodamente
      }
      if (count == 0) {
        it.print(10, 36, id(font_small), id(red), "Sin dispositivos activos");
      }

