# ===================================================================
# PETRAKA MINI - ESP32-C3 Super Mini
# -------------------------------------------------------------------
# Publica cada 60 s un paquete JSON por MQTT con:
#   - device_id : ultimos 3 bytes de la MAC (unico por placa)
#   - timestamp : hora local ISO-8601
#   - epoch     : hora Unix
#   - uptime_s  : segundos desde el arranque
#
# Topic de datos:  <topic_prefix>/data
# Topic de estado: <topic_prefix>/status   (retained "online")
# donde <topic_prefix> = "petraka-mini-xxxxxx" (sufijo MAC automatico)
#
# Hora: SNTP (autonomo, no depende de Home Assistant).
# ===================================================================
substitutions:
  dev_name: "petraka-mini"
  dev_friendly_name: "Petraka Mini"
  zona_horaria: "America/Argentina/Buenos_Aires"

  # Broker MQTT
  mqtt_host: "mqtt.petraka.com.ar"
  mqtt_port: "1883"
  mqtt_user: "alejandro"
  mqtt_pass: "piteroski1984"

  version_number: "V1.0.0"

esphome:
  name: ${dev_name}
  friendly_name: ${dev_friendly_name}
  name_add_mac_suffix: true
  min_version: 2025.9.0

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: esp-idf

logger:
  level: INFO

# API / OTA / Web opcionales: el envio MQTT no depende de ellos.
api:
  reboot_timeout: 0s

ota:
  - platform: esphome

# NOTA: sin web_server. En modo AP, el web_server tapa en "/" la pagina
# del captive_portal y sirve una UI que carga JS desde oi.esphome.io
# (no funciona sin internet). Con captive_portal solo, "/" sirve el
# formulario de provisioning autonomo (192.168.4.1 -> cargar WiFi).
wifi:
  id: wifi_component
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  reboot_timeout: 0s
  power_save_mode: none
  fast_connect: false
  # Placas C3 Super Mini suelen desensibilizarse por el PA: bajar TX ayuda.
  output_power: 8.5dB
  ap:
    ssid: "Petraka Mini Debug"
    password: "petraka1234"
    ap_timeout: 30s
captive_portal:

# -------------------------------------------------------------------
# MQTT
# -------------------------------------------------------------------
mqtt:
  id: mqtt_client
  broker: ${mqtt_host}
  port: ${mqtt_port}
  username: ${mqtt_user}
  password: ${mqtt_pass}
  reboot_timeout: 0s
  # Al ser igual al nombre del componente, ESPHome expande el sufijo MAC
  # en el topic_prefix efectivo -> cada placa publica en su propio topic.
  topic_prefix: ${dev_name}
  # Birth/Will por defecto usan un topic estatico compartido; se desactivan
  # y el estado online se publica en on_connect con el topic unico real.
  birth_message:
  will_message:
  shutdown_message:
  on_connect:
    then:
      - lambda: |-
          std::string base = id(mqtt_client).get_topic_prefix();
          id(mqtt_client).publish(base + "/status", std::string("online"), 0, true);
          ESP_LOGI("mqtt", "Conectado. Topic base: %s", base.c_str());
  on_disconnect:
    then:
      - logger.log: "MQTT desconectado. Se reintentara automaticamente."

# -------------------------------------------------------------------
# HORA (SNTP autonomo + fallback Home Assistant)
# -------------------------------------------------------------------
time:
  - platform: sntp
    id: sntp_time
    timezone: ${zona_horaria}
    servers:
      - pool.ntp.org
      - time.google.com
  - platform: homeassistant
    id: ha_time
    timezone: ${zona_horaria}

# -------------------------------------------------------------------
# ENVIO PERIODICO (cada 60 s)
# -------------------------------------------------------------------
interval:
  - interval: 60s
    then:
      - lambda: |-
          // Espera a que haya hora valida (SNTP o HA).
          auto now = id(sntp_time).now();
          if (!now.is_valid()) now = id(ha_time).now();
          if (!now.is_valid()) {
            ESP_LOGW("telemetry", "Hora no sincronizada todavia, se omite el envio.");
            return;
          }

          if (!id(mqtt_client).is_connected()) {
            ESP_LOGW("telemetry", "MQTT no conectado, se omite el envio.");
            return;
          }

          // ID unico = ultimos 6 caracteres hex del nombre (sufijo MAC de 3 bytes).
          std::string full_name = App.get_name();
          std::string dev_id = full_name.length() > 6
                                 ? full_name.substr(full_name.length() - 6)
                                 : full_name;

          char iso[32];
          now.strftime(iso, sizeof(iso), "%Y-%m-%dT%H:%M:%S%z");

          char payload[256];
          snprintf(payload, sizeof(payload),
                   "{\"device_id\":\"%s\",\"friendly_name\":\"%s\",\"timestamp\":\"%s\",\"epoch\":%lld,\"uptime_s\":%lu,\"version\":\"%s\"}",
                   dev_id.c_str(), App.get_friendly_name().c_str(), iso,
                   (long long) now.timestamp, (unsigned long) (millis() / 1000),
                   "${version_number}");

          std::string topic = id(mqtt_client).get_topic_prefix() + "/data";
          id(mqtt_client).publish(topic, std::string(payload));
          ESP_LOGI("telemetry", "Publicado [%s]: %s", topic.c_str(), payload);

# -------------------------------------------------------------------
# SENSORES DE ESTADO (visibles por MQTT/Web)
# -------------------------------------------------------------------
text_sensor:
  - platform: template
    name: "Device ID"
    id: device_id_ts
    icon: "mdi:identifier"
    update_interval: 60s
    lambda: |-
      std::string full_name = App.get_name();
      return {full_name.length() > 6 ? full_name.substr(full_name.length() - 6) : full_name};
