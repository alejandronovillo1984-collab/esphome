# ===================================================================
# SECCIÓN 1: Sustituciones (Variables de Configuración)
# Define variables clave para facilitar la reconfiguración.
# El valor dev_name se usa como topic_prefix en MQTT.
# ===================================================================
substitutions:
  # 1. IDENTIDAD DEL DISPOSITIVO
  dev_name: "a68jqp1jtyng1umhqzdb"
  dev_friendly_name: "REGADEITOR V1"

  # 2. CONEXIÓN WIFI
  wifi_dev_ssid: "redAlejandroRT"
  wifi_dev_pass: "lolita11"

  # 3. SERVIDOR MQTT
  mqtt_host: "mqtt.hidroponiacentenario.com.ar"
  mqtt_port: "1883"
  mqtt_user: "alejandro"
  mqtt_pass: "piteroski1984"

  # 4. HARDWARE (Pines del Kincony KC868-A4)
  pin_zona_1: "23" 
  pin_zona_2: "25" 
  pin_zona_3: "5"  
  pin_zona_4: "4"  

  # 5. VALORES POR DEFECTO
  zona_horaria: "America/Argentina/Buenos_Aires"
  horario_default: "8, 20"
  duracion_default: "10" # Duración en minutos

# ===================================================================
# SECCIÓN 2: Configuración Básica del ESP32
# ===================================================================
esphome:
  name: ${dev_name}
  friendly_name: ${dev_friendly_name}
  min_version: 2025.9.0
  name_add_mac_suffix: false

  # Tareas a ejecutar inmediatamente después del arranque
  on_boot:
    priority: 600
    then:
      - script.execute: actualizar_tiempos # Ajusta el tiempo de riego a la variable.
      - component.update: sensor_texto_estado # Actualiza el estado inicial.
      - switch.turn_on: habilitar_z1 # Asegura que las zonas estén habilitadas.
      - switch.turn_on: habilitar_z2
      - switch.turn_on: habilitar_z3
      - switch.turn_on: habilitar_z4

esp32:
  board: esp32dev
  framework:
    type: esp-idf

http_request:
  timeout: 60s

logger:
  level: INFO

ota:
  - platform: esphome
  - platform: http_request

web_server:
  port: 80

# ===================================================================
# SECCIÓN 3: Conectividad
# ===================================================================
wifi:
  id: wifi_component
  networks:
    - ssid: ${wifi_dev_ssid}
      password: ${wifi_dev_pass}
      priority: 20.0
  ap:
    ssid: "AP-${dev_name}"
    password: "admin123456"
    ap_timeout: 1min

captive_portal:

mqtt:
  broker: ${mqtt_host}
  port: ${mqtt_port}
  username: ${mqtt_user}
  password: ${mqtt_pass}
  topic_prefix: ${dev_name} # Usa 'regadeitor' como prefijo de todos los tópicos
  discovery: false
  keepalive: 180s
  reboot_timeout: 5min
  on_connect:
    - logger.log: ">> CONEXIÓN MQTT ESTABLECIDA <<"
    - component.update: reloj_sntp
  on_message:
    - topic: "${dev_name}/sync_time" # Tópico para forzar sincronización de hora
      then:
        - component.update: reloj_sntp

time:
  - platform: sntp
    id: reloj_sntp
    timezone: ${zona_horaria}
    servers: [0.pool.ntp.org, 1.pool.ntp.org]
    # Lógica de programación cron: se ejecuta cada hora, al minuto 0.
    on_time:
      - seconds: 0
        minutes: 0
        then:
          - lambda: |-
              int current_hour = id(reloj_sntp).now().hour;
              std::string sched = id(horas_programadas).state;
              std::string num_str = "";
              bool activate = false;
              for (char c : sched) {
                if (isdigit(c)) { num_str += c; } 
                else if (c == ',' || c == ' ') {
                  if (num_str.length() > 0) {
                    if (atoi(num_str.c_str()) == current_hour) activate = true;
                    num_str = "";
                  }
                }
              }
              if (num_str.length() > 0) {
                if (atoi(num_str.c_str()) == current_hour) activate = true;
              }
              if (activate) {
                ESP_LOGI("cron", "Hora coincidente. Iniciando Ciclo.");
                id(iniciar_ciclo_seguro).execute();
              }

# ===================================================================
# SECCIÓN 4: Variables y Sensores de Configuración (text, number)
# Permite modificar los valores desde Home Assistant vía MQTT.
# ===================================================================
text:
  # Variable para las horas programadas de riego (ej: "8, 20")
  - platform: template
    name: "Horas de Riego (CSV)"
    id: horas_programadas
    optimistic: true
    mode: TEXT
    restore_value: true
    initial_value: ${horario_default}

  # Variables para OTA Remota (URL y MD5 del firmware)
  - platform: template
    name: "MD5 de Firmware OTA"
    id: ota_md5
    optimistic: true
    mode: TEXT
    restore_value: true
    initial_value: "" 
  - platform: template
    name: "URL de Firmware OTA"
    id: ota_url_text
    optimistic: true
    mode: TEXT
    restore_value: true
    initial_value: "https://" 

number:
  # Duración del riego en minutos (afecta a todas las válvulas)
  - platform: template
    name: "Duracion Riego Minutos"
    id: var_duracion
    optimistic: true
    min_value: 1
    max_value: 120
    step: 1
    initial_value: ${duracion_default}
    restore_value: true
    on_value:
      then:
        - script.execute: actualizar_tiempos # Ejecuta script para actualizar sprinkler run_duration

# ===================================================================
# SECCIÓN 5: Switches (Relés y Habilitadores)
# ===================================================================
switch:
  # Relés GPIO (Las salidas físicas)
  - platform: gpio
    id: sw_rele_1
    pin: ${pin_zona_1}
    internal: true
    on_turn_on:
      - component.update: sensor_texto_estado
    on_turn_off:
      - component.update: sensor_texto_estado
  - platform: gpio
    id: sw_rele_2
    pin: ${pin_zona_2}
    internal: true
    on_turn_on:
      - component.update: sensor_texto_estado
    on_turn_off:
      - component.update: sensor_texto_estado
  - platform: gpio
    id: sw_rele_3
    pin: ${pin_zona_3}
    internal: true
    on_turn_on:
      - component.update: sensor_texto_estado
    on_turn_off:
      - component.update: sensor_texto_estado
  - platform: gpio
    id: sw_rele_4
    pin: ${pin_zona_4}
    internal: true
    on_turn_on:
      - component.update: sensor_texto_estado
    on_turn_off:
      - component.update: sensor_texto_estado

  # Switches Template para Habilitar/Deshabilitar zonas (control lógico)
  - platform: template
    id: habilitar_z1
    name: "Habilitar Zona 1"
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    internal: true
  - platform: template
    id: habilitar_z2
    name: "Habilitar Zona 2"
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    internal: true
  - platform: template
    id: habilitar_z3
    name: "Habilitar Zona 3"
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    internal: true
  - platform: template
    id: habilitar_z4
    name: "Habilitar Zona 4"
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    internal: true

# ===================================================================
# SECCIÓN 6: Lógica del Sistema de Riego (Sprinkler)
# Define el controlador de riego secuencial.
# ===================================================================
sprinkler:
  - id: controlador_riego
    name: "Sistema de Riego General"
    main_switch: "Interruptor Maestro"
    auto_advance_switch: "Avance Automatico"
    valve_overlap: 0s
    valves:
      - valve_switch: "Valvula 1"
        valve_switch_id: sw_rele_1
        enable_switch: habilitar_z1
        run_duration: 600s # Duración inicial (se actualiza con script)
      - valve_switch: "Valvula 2"
        valve_switch_id: sw_rele_2
        enable_switch: habilitar_z2
        run_duration: 600s
      - valve_switch: "Valvula 3"
        valve_switch_id: sw_rele_3
        enable_switch: habilitar_z3
        run_duration: 600s
      - valve_switch: "Valvula 4"
        valve_switch_id: sw_rele_4
        enable_switch: habilitar_z4
        run_duration: 600s

# ===================================================================
# SECCIÓN 7: Intervalos y Sensores de Texto
# ===================================================================
interval:
  # Loguea el estado del riego cada 400 segundos
  - interval: 400s
    then:
      - logger.log:
          format: "Estado Riego: %s"
          args: ["id(sensor_texto_estado).state.c_str()"]

text_sensor:
  # Muestra el estado actual del riego (qué zona está activa o si está en espera)
  - platform: template
    name: "Estado Actual Riego"
    id: sensor_texto_estado
    icon: "mdi:water-pump"
    update_interval: never
    lambda: |-
      if (id(sw_rele_1).state) return {"Regando: ZONA 1"};
      if (id(sw_rele_2).state) return {"Regando: ZONA 2"};
      if (id(sw_rele_3).state) return {"Regando: ZONA 3"};
      if (id(sw_rele_4).state) return {"Regando: ZONA 4"};
      return {"En Espera"};

# ===================================================================
# SECCIÓN 8: Botones (Acciones Manuales)
# ===================================================================
button:
  # Inicia el ciclo de riego completo de forma manual
  - platform: template
    name: "Iniciar Ciclo Completo Manual"
    id: btn_manual_start
    on_press:
      - logger.log: "Iniciando secuencia manual..."
      - script.execute: iniciar_ciclo_seguro

  # Restaura las variables de configuración a los valores por defecto
  - platform: template
    name: "Restaurar Valores de Riego"
    id: btn_reset_vars
    icon: "mdi:restore-alert"
    on_press:
      - logger.log: "Restaurando variables a default..."
      - text.set:
          id: horas_programadas
          value: ${horario_default}
      - number.set:
          id: var_duracion
          value: ${duracion_default}
      - switch.turn_on: habilitar_z1
      - switch.turn_on: habilitar_z2
      - switch.turn_on: habilitar_z3
      - switch.turn_on: habilitar_z4
      - script.execute: actualizar_tiempos

  # Inicia la actualización de firmware remota
  - platform: template
    name: "Iniciar Actualización OTA"
    id: btn_ota_update
    icon: mdi:cloud-upload
    on_press:
      - logger.log:
          format: "Disparando OTA desde URL: %s"
          args: ["id(ota_url_text).state.c_str()"]
      - ota.http_request.flash:
          url: !lambda "return id(ota_url_text).state;"
          md5_url: !lambda "return id(ota_md5).state;"

  # Botón de reinicio de sistema
  - platform: restart
    id: btn_restart_system
    name: "Reiniciar Sistema"

# ===================================================================
# SECCIÓN 9: Scripts (Automatización de Acciones)
# ===================================================================
script:
  # Script para actualizar el run_duration de todas las válvulas.
  - id: actualizar_tiempos
    then:
      - sprinkler.set_valve_run_duration:
          id: controlador_riego
          valve_number: 0 # Válvula 1
          run_duration: !lambda "return id(var_duracion).state * 60;" # Convierte minutos a segundos
      - sprinkler.set_valve_run_duration:
          id: controlador_riego
          valve_number: 1 # Válvula 2
          run_duration: !lambda "return id(var_duracion).state * 60;"
      - sprinkler.set_valve_run_duration:
          id: controlador_riego
          valve_number: 2 # Válvula 3
          run_duration: !lambda "return id(var_duracion).state * 60;"
      - sprinkler.set_valve_run_duration:
          id: controlador_riego
          valve_number: 3 # Válvula 4
          run_duration: !lambda "return id(var_duracion).state * 60;"

  # Script para iniciar el ciclo, asegurando que los tiempos estén actualizados
  - id: iniciar_ciclo_seguro
    then:
      - script.execute: actualizar_tiempos
      - delay: 1s
      - sprinkler.start_full_cycle: controlador_riego