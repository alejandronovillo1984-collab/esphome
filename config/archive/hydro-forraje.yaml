# ===================================================================
# SECCIÓN 1: Sustituciones (Variables de Configuración)
# ===================================================================
substitutions:
  # 1. IDENTIDAD DEL DISPOSITIVO
  dev_name: "hydro-forraje"
  dev_friendly_name: "HYDRO FORRAJE"

  # 2. CONEXIÓN WIFI
  wifi_dev_ssid: "redAlejandroRT"
  wifi_dev_pass: "lolita11"

  # 3. SERVIDOR MQTT
  mqtt_host: "mqtt.hidroponiacentenario.com.ar"
  mqtt_port: "1883"
  mqtt_user: "alejandro"
  mqtt_pass: "piteroski1984"

  # 4. VALORES POR DEFECTO
  zona_horaria: "America/Argentina/Buenos_Aires"
  
  # 5. PINES DE VÁLVULAS (Por favor verificar/modificar)
  pin_v1: "23" # Válvula Principal (Agua)
  pin_v2: "25" # Válvula Sanitizante / Agua Normal
  pin_v3: "27" # Válvula Nutrientes

# ===================================================================
# SECCIÓN 2: Configuración Básica del ESP32
# ===================================================================
esphome:
  name: ${dev_name}
  friendly_name: ${dev_friendly_name}

esp32:
  board: esp32dev
  framework:
    type: esp-idf

http_request:
  timeout: 60s

logger:
  level: INFO

# Enable Home Assistant API
api:
  encryption:
    key: "E4i4IQ58gj0xo8XxHxhm5pIW4O9EcZdUUtKWULxyCR0="

ota:
  - platform: esphome
    password: "60db2406aa727c70668d4d5024872f58"
  - platform: http_request

web_server:
  port: 80

# ===================================================================
# SECCIÓN 3: Conectividad
# ===================================================================
wifi:
  id: wifi_component
  networks:
    - ssid: ${wifi_dev_ssid}
      password: ${wifi_dev_pass}
      priority: 20.0
  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "AP-${dev_name}"
    password: "dFsGT4DPUy3W"
    ap_timeout: 1min

captive_portal:

mqtt:
  broker: ${mqtt_host}
  port: ${mqtt_port}
  username: ${mqtt_user}
  password: ${mqtt_pass}
  topic_prefix: ${dev_name}
  discovery: false
  keepalive: 180s
  reboot_timeout: 5min
  on_connect:
    - logger.log: ">> CONEXIÓN MQTT ESTABLECIDA <<"
    - component.update: reloj_sntp

time:
  - platform: sntp
    id: reloj_sntp
    timezone: ${zona_horaria}
    servers: [0.pool.ntp.org, 1.pool.ntp.org]
    on_time:
      # A las 00:00 avanzamos de día si está activo
      - seconds: 0
        minutes: 0
        hours: 0
        then:
          - lambda: |-
              if (id(sistema_activo)) {
                id(dia_actual) += 1;
                id(ciclos_hoy) = 0;
                ESP_LOGI("ciclo", "Avanzando al Día %d", id(dia_actual));
                if (id(dia_actual) > 14) {
                  id(sistema_activo) = false;
                  ESP_LOGI("ciclo", "¡Ciclo de 14 días completado!");
                }
              }
      # Cada minuto, chequeamos si nos toca regar
      - seconds: 0
        then:
          - lambda: |-
              if (!id(sistema_activo)) return;
              
              int d = id(dia_actual);
              auto time = id(reloj_sntp).now();
              int min_of_day = time.hour * 60 + time.minute;
              
              int interval_mins = 0;
              if (d == 1) interval_mins = 180;
              else if (d >= 2 && d <= 3) interval_mins = 120;
              else if (d >= 4 && d <= 6) interval_mins = 120;
              else if (d >= 7 && d <= 12) interval_mins = 90;
              else if (d >= 13 && d <= 14) interval_mins = 180;
              
              if (interval_mins > 0 && (min_of_day % interval_mins == 0)) {
                ESP_LOGI("cron", "Hora coincidente con la frecuencia (%d min). Iniciando Riego.", interval_mins);
                id(ejecutar_riego).execute();
              }

# ===================================================================
# SECCIÓN 4: Variables Globales (Estado del Sistema)
# ===================================================================
globals:
  - id: dia_actual
    type: int
    restore_value: yes
    initial_value: '0' # 0 = Detenido, 1 a 14 = En progreso
  - id: ciclos_hoy
    type: int
    restore_value: yes
    initial_value: '0'
  - id: sistema_activo
    type: bool
    restore_value: yes
    initial_value: 'false'

# ===================================================================
# SECCIÓN 5: Sensores y Controles (MQTT / Home Assistant)
# ===================================================================
text_sensor:
  - platform: template
    name: "Estado Actual Ciclo"
    id: estado_actual_texto
    icon: "mdi:sprout"
    update_interval: 10s
    lambda: |-
      if (!id(sistema_activo)) return {"Detenido"};
      int d = id(dia_actual);
      if (d == 1) return {"Día 1: Hidratación / Siembra"};
      if (d >= 2 && d <= 3) return {"Día 2-3: Germinación"};
      if (d >= 4 && d <= 6) return {"Día 4-6: Inicio Crecimiento"};
      if (d >= 7 && d <= 10) return {"Día 7-10: Crecimiento Máximo"};
      if (d >= 11 && d <= 12) return {"Día 11-12: Engorde / Pico"};
      if (d >= 13 && d <= 14) return {"Día 13-14: Lavado / Cosecha"};
      return {"Finalizado o Fuera de Rango"};

number:
  - platform: template
    name: "Día Actual (Manual)"
    id: set_dia_actual
    min_value: 0
    max_value: 15
    step: 1
    update_interval: 10s
    lambda: "return id(dia_actual);"
    set_action:
      - globals.set:
          id: dia_actual
          value: !lambda "return x;"
      - if:
          condition:
            lambda: 'return x > 0 && x <= 14;'
          then:
            - globals.set:
                id: sistema_activo
                value: 'true'
          else:
            - globals.set:
                id: sistema_activo
                value: 'false'

switch:
  - platform: template
    name: "Iniciar / Detener Ciclo Forraje"
    id: switch_iniciar_ciclo
    icon: "mdi:power"
    lambda: "return id(sistema_activo);"
    turn_on_action:
      - globals.set:
          id: sistema_activo
          value: 'true'
      - globals.set:
          id: dia_actual
          value: '1'
      - globals.set:
          id: ciclos_hoy
          value: '0'
      - logger.log: "Ciclo INICIADO. Día 1."
    turn_off_action:
      - globals.set:
          id: sistema_activo
          value: 'false'
      - globals.set:
          id: dia_actual
          value: '0'
      - logger.log: "Ciclo DETENIDO."

  # Válvulas Físicas
  - platform: gpio
    pin: ${pin_v1}
    id: valvula_1
    name: "Válvula 1 (Principal)"
    internal: false
  - platform: gpio
    pin: ${pin_v2}
    id: valvula_2
    name: "Válvula 2 (Sanitizante)"
    internal: false
  - platform: gpio
    pin: ${pin_v3}
    id: valvula_3
    name: "Válvula 3 (Nutrientes)"
    internal: false

# ===================================================================
# SECCIÓN 6: Lógica de Riego (Scripts)
# ===================================================================
script:
  - id: ejecutar_riego
    mode: single
    then:
      - lambda: |-
          if (!id(sistema_activo)) {
            ESP_LOGI("riego", "Proceso de riego omitido: el sistema no está activo.");
            return;
          }
          
          id(ciclos_hoy) += 1;
          int d = id(dia_actual);
          int ciclo = id(ciclos_hoy);
          
          int t_v1 = 0; // Segundos V1
          int t_v2 = 0; // Segundos V2
          int t_v3 = 0; // Segundos V3
          
          if (d == 1) {
            t_v1 = 5; t_v3 = 0;
            if (ciclo == 1) t_v2 = 1;
          } else if (d >= 2 && d <= 3) {
            t_v1 = 5; t_v3 = 0;
            if (ciclo == 1) t_v2 = 1;
          } else if (d >= 4 && d <= 6) {
            t_v1 = 7; t_v3 = 2; // Concentración baja (ajustar a 1 o 2s)
            if (ciclo == 1) t_v2 = 1;
          } else if (d >= 7 && d <= 10) {
            t_v1 = 7; t_v3 = 4; // Concentración media/alta
            if (ciclo == 1) t_v2 = 1;
          } else if (d >= 11 && d <= 12) {
            t_v1 = 7; t_v3 = 5; // Máxima concentración
            if (ciclo == 1) t_v2 = 1;
          } else if (d >= 13 && d <= 14) {
            t_v1 = 10; t_v3 = 0;
            if (ciclo == 1) t_v2 = 1;
          } else {
            ESP_LOGW("riego", "Día fuera de rango (%d), no se riega.", d);
            return;
          }
          
          ESP_LOGI("riego", "Ejecutando Riego Día %d (Ciclo %d): V1=%ds, V2=%ds, V3=%ds", d, ciclo, t_v1, t_v2, t_v3);
          
          if (t_v1 > 0) {
            id(valvula_1).turn_on();
            App.scheduler.set_timeout(id(valvula_1), "v1_off", t_v1 * 1000, []() { id(valvula_1).turn_off(); });
          }
          if (t_v2 > 0) {
            id(valvula_2).turn_on();
            App.scheduler.set_timeout(id(valvula_2), "v2_off", t_v2 * 1000, []() { id(valvula_2).turn_off(); });
          }
          if (t_v3 > 0) {
            id(valvula_3).turn_on();
            App.scheduler.set_timeout(id(valvula_3), "v3_off", t_v3 * 1000, []() { id(valvula_3).turn_off(); });
          }