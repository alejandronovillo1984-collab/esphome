    id: htit_gnss_latitude
  longitude:
    name: "Longitude"
    id: htit_gnss_longitude
  altitude:
    name: "Altitude"
    id: htit_gnss_altitude
  speed:
    name: "Speed"
    id: htit_gnss_speed
  course:
    name: "Course"
    id: htit_gnss_course
  satellites:
    name: "Satellites"
    id: htit_gnss_satellites
  hdop:
    name: "HDOP"
    id: htit_gnss_hdop
