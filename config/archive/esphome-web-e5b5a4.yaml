    icon: "mdi:cow"
    on_press:
      - script.execute: run_feeding_routine_script

  # Botón Sonar Bocina Manual (3 segundos)
  - platform: template
    name: "Sonar Bocina (3s)"
    icon: "mdi:volume-high"
    on_press:
      - switch.turn_on: bocina_relay
      - delay: 3s
      - switch.turn_off: bocina_relay

# User button
binary_sensor:
  - platform: gpio
    id: user_button
    name: "USER Button"
    pin:
      number: GPIO0
      mode: INPUT_PULLUP
      inverted: true

# Packet Transport (transmits GNSS, battery, distance and food level percentage over LoRa)
# Optimizado para enviar únicamente la información crucial y no sobrepasar el límite físico de 256 bytes de la FIFO LoRa
packet_transport:
  - platform: sx126x
    update_interval: 5min
    ping_pong_enable: true
    rolling_code_enable: true
    encryption: !secret lora_encryption_key
    providers:
      - name: "lora"
        encryption: !secret lora_encryption_key
    sensors:
      - htit_gnss_latitude
      - htit_gnss_longitude
      - id: bat_voltage
        broadcast_id: remote_bat_voltage
      - id: food_level
        broadcast_id: remote_food_level
      - id: food_percentage
        broadcast_id: remote_food_percentage

# Text Sensors (WiFi info & Date/Time)
text_sensor:
  - platform: wifi_info
    ip_address:
      name: "IP Address"
      id: wifi_ip
    ssid:
      name: "SSID"
      id: wifi_ssid_sensor

  - platform: template
    name: "Comedero Fecha Hora"
    id: date_time_sensor
    icon: "mdi:clock"
    update_interval: 1s
    lambda: |-
      auto now = id(homeassistant_time).now();
      if (!now.is_valid()) {
        now = id(gnss_time).now();
      }
      if (!now.is_valid()) {
        return {"Sin Sincronizar"};
      }
      char buf[30];
      now.strftime(buf, sizeof(buf), "%d/%m/%Y %H:%M:%S");
      return {buf};
