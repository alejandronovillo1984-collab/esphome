      - script.stop: ejecutar_manual_c4
      - lambda: 'id(auto_c4) = true;'
      - switch.turn_off: relay_c4
      - lambda: 'id(auto_c4) = false;'
      - lambda: 'id(manual_c4) = false;'
      - logger.log: "Canal 4 forzado manual OFF"

