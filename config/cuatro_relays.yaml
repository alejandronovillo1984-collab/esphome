# ===================================================================
# SWITCHES: RELES + PROGRAMADOR POR CANAL
# ===================================================================
switch:
  # ---- Canal 1 ----
  - platform: gpio
    pin: ${pin_r1}
    id: relay_c1
    name: "${dev_name} canal 1 relay"
    restore_mode: ALWAYS_OFF
    inverted: ${relay_inverted}
    icon: "mdi:electric-switch"
    on_turn_on:
      - lambda: |-
          if (id(auto_c1)) return;
          id(modo_c1).publish_state("manual");
          ESP_LOGI("canal", "Canal 1 ON manual -> modo manual");

  - platform: template
    name: "${dev_name} canal 1 programador"
    id: prog_c1
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    icon: "mdi:toggle-switch"
    turn_on_action:
      - logger.log: "Canal 1 programador ON"
      - script.execute: verificar_canales
    turn_off_action:
      - lambda: |-
          int m = (int) id(modo_c1).active_index().value_or(0);
          if (m >= 2 && !id(manual_c1)) {
            id(auto_c1) = true;
            id(relay_c1).turn_off();
            id(auto_c1) = false;
          }
      - logger.log: "Canal 1 programador OFF"

  - platform: template
    name: "${dev_name} canal 1 forzado manual"
    id: forzado_c1
    optimistic: true
    restore_mode: ALWAYS_OFF
    icon: "mdi:hand-back-right"
    turn_on_action:
      - script.stop: ejecutar_manual_c1
      - lambda: |-
          id(manual_c1) = true;
          id(auto_c1) = true;
      - switch.turn_on: relay_c1
      - lambda: 'id(auto_c1) = false;'
      - logger.log: "Canal 1 forzado manual ON"
    turn_off_action:
      - script.stop: ejecutar_manual_c1
      - lambda: 'id(auto_c1) = true;'
      - switch.turn_off: relay_c1
      - lambda: 'id(auto_c1) = false;'
      - lambda: 'id(manual_c1) = false;'
      - logger.log: "Canal 1 forzado manual OFF"

  # ---- Canal 2 ----
  - platform: gpio
    pin: ${pin_r2}
    id: relay_c2
