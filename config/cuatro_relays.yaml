# ===================================================================
# SCRIPTS
# ===================================================================
script:
  # Al arrancar: reles OFF y flags manuales limpios. Luego se evalua el plan
  # (si todavia no hay hora valida, los modos automaticos esperan al SNTP).
  - id: aplicar_arranque
    then:
      - lambda: |-
          switch_::Switch *rels[4] = {id(relay_c1), id(relay_c2), id(relay_c3), id(relay_c4)};
          bool *auto_flags[4] = {&id(auto_c1), &id(auto_c2), &id(auto_c3), &id(auto_c4)};
          for (int i = 0; i < 4; i++) {
            *auto_flags[i] = true;
            rels[i]->turn_off();
            *auto_flags[i] = false;
          }
          id(manual_c1) = false;
          id(manual_c2) = false;
          id(manual_c3) = false;
          id(manual_c4) = false;
          ESP_LOGI("boot", "Arranque: reles OFF, esperando hora valida");
      - script.execute: verificar_canales

  # Evalua el modo/plan de cada canal. Corre cada minuto y al cambiar
  # modo, extras o programador.
  - id: verificar_canales
    mode: single
    then:
      - lambda: |-
          select::Select *modos[4] = {id(modo_c1), id(modo_c2), id(modo_c3), id(modo_c4)};
          number::Number *extras[4] = {id(extras_c1), id(extras_c2), id(extras_c3), id(extras_c4)};
          switch_::Switch *progs[4] = {id(prog_c1), id(prog_c2), id(prog_c3), id(prog_c4)};
          switch_::Switch *forzados[4] = {id(forzado_c1), id(forzado_c2), id(forzado_c3), id(forzado_c4)};
          switch_::Switch *rels[4] = {id(relay_c1), id(relay_c2), id(relay_c3), id(relay_c4)};
          bool *manual[4] = {&id(manual_c1), &id(manual_c2), &id(manual_c3), &id(manual_c4)};
          bool *auto_flags[4] = {&id(auto_c1), &id(auto_c2), &id(auto_c3), &id(auto_c4)};

          auto plan_should_on = [](int plan, int min_now, int extra) -> bool {
            // Planes 0..5 = los 6 planes del tanque.
            // Plan 6 = germinadora: 08:00, 11:00, 14:00, 17:00 -> 1 min.
            int starts1[] = {450, 720, 900};
            int ends1[]   = {720, 900, 1170};
            int ons1[]    = {15, 15, 15};
            int offs1[]   = {30, 15, 30};
            int night1[]  = {1350, 90, 270};
            int n1 = 3;

            int starts2[] = {420, 630, 720, 960, 1110};
            int ends2[]   = {630, 720, 960, 1110, 1260};
            int ons2[]    = {15, 15, 0, 15, 15};
            int offs2[]   = {30, 15, 30, 15, 30};
            int night2[]  = {1410, 120, 270};
            int n2 = 5;

            int starts3[] = {540, 720, 900, 1080};
            int ends3[]   = {542, 722, 902, 1082};
            int ons3[]    = {0, 0, 0, 0};
            int offs3[]   = {0, 0, 0, 0};
            int n3 = 4;

            int starts4[] = {480, 630, 780, 930, 1080};
            int ends4[]   = {482, 632, 782, 932, 1082};
            int ons4[]    = {0, 0, 0, 0, 0};
            int offs4[]   = {0, 0, 0, 0, 0};
            int n4 = 5;

            int starts5[] = {600, 960};
            int ends5[]   = {602, 962};
            int ons5[]    = {0, 0};
            int offs5[]   = {0, 0};
            int n5 = 2;

            int starts6[] = {540, 720, 900, 1080};
            int ends6[]   = {542, 722, 902, 1082};
            int ons6[]    = {0, 0, 0, 0};
            int offs6[]   = {0, 0, 0, 0};
            int n6 = 4;

            int starts7[] = {480, 660, 840, 1020};
            int ends7[]   = {481, 661, 841, 1021};
            int ons7[]    = {0, 0, 0, 0};
            int offs7[]   = {0, 0, 0, 0};
            int n7 = 4;

            int *starts = starts1;
            int *ends   = ends1;
            int *ons    = ons1;
            int *offs   = offs1;
            int n       = n1;
            int *night  = night1;
            bool night_enabled = true;

            switch (plan) {
              case 1:
                starts = starts2; ends = ends2; ons = ons2; offs = offs2; n = n2; night = night2;
                break;
              case 2:
                starts = starts3; ends = ends3; ons = ons3; offs = offs3; n = n3; night_enabled = false;
                break;
              case 3:
                starts = starts4; ends = ends4; ons = ons4; offs = offs4; n = n4; night_enabled = false;
                break;
              case 4:
                starts = starts5; ends = ends5; ons = ons5; offs = offs5; n = n5; night_enabled = false;
                break;
              case 5:
                starts = starts6; ends = ends6; ons = ons6; offs = offs6; n = n6; night_enabled = false;
                break;
              case 6:
                starts = starts7; ends = ends7; ons = ons7; offs = offs7; n = n7; night_enabled = false;
                break;
            }

            bool should_on = false;
            bool in_window = false;
            for (int i = 0; i < n; i++) {
              if (min_now >= starts[i] && min_now < ends[i] + extra) {
                in_window = true;
                if (ons[i] == 0) {
                  should_on = true;
                } else {
                  int pos = (min_now - starts[i]) % (ons[i] + offs[i]);
                  if (pos < ons[i]) should_on = true;
                }
                break;
              }
            }

            if (!in_window && night_enabled) {
              for (int i = 0; i < 3; i++) {
                int nt = night[i];
                if (min_now >= nt && min_now < nt + 15 + extra) should_on = true;
              }
            }
            return should_on;
          };

          auto t = id(reloj_sntp).now();
          // Guardar el epoch cada 10 min (no cada minuto) para no castigar
          // la flash del ESP8266 con restore_from_flash.
          if (t.is_valid() && t.minute % 10 == 0) id(g_last_epoch) = (uint32_t) t.timestamp;
          int min_now = t.is_valid() ? (t.hour * 60 + t.minute) : -1;

          for (int ch = 0; ch < 4; ch++) {
            int modo = (int) modos[ch]->active_index().value_or(0);
            switch_::Switch *rel = rels[ch];

            // Forzado manual: el rele queda como lo dejo el switch, sin que
            // el plan ni el modo lo pisen.
            if (forzados[ch]->state) continue;

            // Modo apagado: siempre OFF, sin importar hora/programador.
            if (modo == 0) {
              if (rel->state) {
                *auto_flags[ch] = true;
                rel->turn_off();
                *auto_flags[ch] = false;
                ESP_LOGI("canal", "Canal %d OFF (modo apagado)", ch + 1);
              }
              continue;
            }

            // Modo manual: el rele lo maneja el switch/boton, no el plan.
            if (modo == 1) continue;

            // Plan automatico: requiere hora valida, programador ON y que
            // no haya un accionar manual en curso.
            if (min_now < 0) continue;
            if (!progs[ch]->state) continue;
            if (*manual[ch]) continue;

            int plan = modo - 2;
            if (plan < 0 || plan > 6) continue;
            int extra = (int) extras[ch]->state;
            if (extra < 0) extra = 0;
            if (extra > 10) extra = 10;

            bool should_on = plan_should_on(plan, min_now, extra);
            if (should_on && !rel->state) {
              *auto_flags[ch] = true;
              rel->turn_on();
              *auto_flags[ch] = false;
              ESP_LOGI("canal", "Canal %d ON (%02d:%02d) plan %d extra %d",
                       ch + 1, (int) t.hour, (int) t.minute, plan, extra);
            } else if (!should_on && rel->state) {
              *auto_flags[ch] = true;
              rel->turn_off();
              *auto_flags[ch] = false;
              ESP_LOGI("canal", "Canal %d OFF (%02d:%02d) plan %d extra %d",
                       ch + 1, (int) t.hour, (int) t.minute, plan, extra);
            }
          }

  # Accionar ahora: enciende el canal durante "duracion manual".
  - id: ejecutar_manual_c1
    mode: restart
    then:
      - lambda: 'id(forzado_c1).publish_state(false);'
      - globals.set:
          id: manual_c1
          value: 'true'
      - lambda: 'id(auto_c1) = true;'
      - switch.turn_on: relay_c1
      - lambda: 'id(auto_c1) = false;'
      - delay: !lambda "return (uint32_t)(id(duracion_c1).state * 60000.0f);"
      - lambda: 'id(auto_c1) = true;'
      - switch.turn_off: relay_c1
      - lambda: 'id(auto_c1) = false;'
      - globals.set:
          id: manual_c1
          value: 'false'

  - id: ejecutar_manual_c2
    mode: restart
    then:
      - lambda: 'id(forzado_c2).publish_state(false);'
      - globals.set:
          id: manual_c2
          value: 'true'
      - lambda: 'id(auto_c2) = true;'
      - switch.turn_on: relay_c2
      - lambda: 'id(auto_c2) = false;'
      - delay: !lambda "return (uint32_t)(id(duracion_c2).state * 60000.0f);"
      - lambda: 'id(auto_c2) = true;'
      - switch.turn_off: relay_c2
      - lambda: 'id(auto_c2) = false;'
      - globals.set:
          id: manual_c2
          value: 'false'

  - id: ejecutar_manual_c3
    mode: restart
    then:
      - lambda: 'id(forzado_c3).publish_state(false);'
      - globals.set:
          id: manual_c3
          value: 'true'
      - lambda: 'id(auto_c3) = true;'
      - switch.turn_on: relay_c3
      - lambda: 'id(auto_c3) = false;'
      - delay: !lambda "return (uint32_t)(id(duracion_c3).state * 60000.0f);"
      - lambda: 'id(auto_c3) = true;'
      - switch.turn_off: relay_c3
      - lambda: 'id(auto_c3) = false;'
      - globals.set:
          id: manual_c3
          value: 'false'

  - id: ejecutar_manual_c4
    mode: restart
    then:
      - lambda: 'id(forzado_c4).publish_state(false);'
      - globals.set:
          id: manual_c4
          value: 'true'
      - lambda: 'id(auto_c4) = true;'
      - switch.turn_on: relay_c4
      - lambda: 'id(auto_c4) = false;'
      - delay: !lambda "return (uint32_t)(id(duracion_c4).state * 60000.0f);"
      - lambda: 'id(auto_c4) = true;'
      - switch.turn_off: relay_c4
      - lambda: 'id(auto_c4) = false;'
      - globals.set:
          id: manual_c4
          value: 'false'
