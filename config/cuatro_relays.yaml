# ===================================================================
# CUATRO RELAYS - ESP-12F (ESP8266) + 4 RELES
# ===================================================================
# Placa: ESP-12F 4 Channel Relay (5V / 7-30VDC / 90-250VAC)
# Reles activos en ALTO.
#
# Pines (template blakadder ESP12F_Relay_X4):
#   Relay 1 -> GPIO16  (puede dar un pulso breve al boot)
#   Relay 2 -> GPIO14
#   Relay 3 -> GPIO12
#   Relay 4 -> GPIO13
#
# IMPORTANTE: esta placa trae un header de jumpers RY1-RY4 (P3) que conecta
# esos GPIO con los drivers de los reles. Si los jumpers no estan colocados,
# el GPIO cambia de estado pero el rele fisico NO se mueve.
# Driver: transistor NPN + rele de 5V => activo en ALTO (inverted: false).
#
# Cada canal tiene su propio modo, tiempos, programador y estado.
# Modos: apagado, manual, 6 planes de riego del tanque y "germinadora".
# ===================================================================

substitutions:
  # 1. IDENTIDAD DEL DISPOSITIVO
  name: "cuatro_relays"
  dev_name: "cuatro_relays"
  friendly_name: "Cuatro Relays"

  # 2. ZONA HORARIA
  zona_horaria: "America/Argentina/Buenos_Aires"

  # 3. SERVIDOR MQTT
  mqtt_host: "mqtt.petraka.com.ar"
  mqtt_port: "1883"
  mqtt_user: "alejandro"
  mqtt_pass: "piteroski1984"

  # 4. PINES DE RELES
  #    Relay 1 en GPIO16: la placa puede dar un pulso breve al energizar.
  #    Para evitarlo, mover el jumper fisico de Relay1 a GPIO15 y cambiar
  #    pin_r1 por "15" (GPIO15 es strapping pin, debe quedar bajo al boot).
  pin_r1: "16"
  pin_r2: "14"
  pin_r3: "12"
  pin_r4: "13"

  # Reles activos en alto. Si la placa resultara activa en bajo, poner "true".
  relay_inverted: "false"

  # 5. VALORES POR DEFECTO
  duracion_default: "10"
  extras_default: "0"

  # Version de firmware reportada por MQTT.
  fw_version: "1.0.7"

# ===================================================================
# PREFERENCIAS / PERSISTENCIA
# ===================================================================
preferences:
  flash_write_interval: 10s

# ===================================================================
# CONFIGURACION BASICA DEL ESP8266
# ===================================================================
esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  name_add_mac_suffix: true

  on_boot:
    - priority: 600.0
      then:
        - lambda: |-
            uint32_t ep = id(g_last_epoch);
            if (ep > 1500000000) {
              struct timeval tv{};
              tv.tv_sec = static_cast<time_t>(ep);
              tv.tv_usec = 0;
              settimeofday(&tv, nullptr);
              ESP_LOGI("boot", "Hora restaurada de backup: %u", ep);
            } else {
              ESP_LOGW("boot", "Sin hora de backup previa (%u)", ep);
            }
    - priority: 950.0
      then:
        - lambda: |-
            std::string mac = get_mac_address();
            std::string suffix = mac.substr(mac.length() - 6);
            std::string prefix = std::string("${dev_name}-") + suffix;
            if (global_mqtt_client != nullptr) {
              global_mqtt_client->set_topic_prefix(prefix, "");
              global_mqtt_client->set_birth_message({prefix + "/status", "online", 0, true});
              global_mqtt_client->set_last_will({prefix + "/status", "offline", 0, true});
              ESP_LOGI("mqtt", "Topic prefix dinamico: %s", prefix.c_str());
            }
    - priority: -100
      then:
        - text_sensor.template.publish:
            id: firmware_version
            state: "${fw_version}"
        - lambda: 'id(ota_status).publish_state("ok");'
        - script.execute: aplicar_arranque
    - priority: -50
      then:
        - delay: 5s
        - if:
            condition:
              wifi.connected:
            then:
              - logger.log: "WiFi STA conectado al boot; MQTT habilitado"
            else:
              - mqtt.disable:
              - logger.log: "Sin STA (modo AP); MQTT deshabilitado para liberar RAM"

esp8266:
  board: nodemcuv2
  # Necesario para que select/number/switch restore_value sobrevivan a un
  # corte de energia (por defecto ESP8266 guarda preferencias en RTC).
  restore_from_flash: true

http_request:
  timeout: 60s
  # ESP8266 no valida certificados; el componente usa TLS inseguro.
  verify_ssl: false

logger:
  level: INFO

# OTA nativo ESPHome (LAN/serial) + OTA remoto por HTTP (app petraka)
ota:
  - platform: esphome
    password: "70bb4d07679ffd714264a223ca907813"
  - platform: http_request
    id: ota_http

# ===================================================================
# CONECTIVIDAD
# ===================================================================
wifi:
  id: wifi_component
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none
  reboot_timeout: 0s
  on_connect:
    - mqtt.enable:
    - logger.log: "WiFi STA conectado; MQTT habilitado"
  on_disconnect:
    - mqtt.disable:
    - logger.log: "WiFi STA desconectado; MQTT deshabilitado"
  ap:
    ssid: "Setup Cuatro Relays"
    password: "centenario123"
    ap_timeout: 20s
    manual_ip:
      static_ip: 192.168.4.1
      gateway: 192.168.4.1
      subnet: 255.255.255.0

captive_portal:

mqtt:
  id: mqtt_client
  broker: ${mqtt_host}
  port: ${mqtt_port}
  username: ${mqtt_user}
  password: ${mqtt_pass}
  topic_prefix: ${dev_name} # Se setea dinamicamente con el MAC en on_boot
  discovery: false
  keepalive: 120s
  # 0s: no reiniciar mientras esta en AP de configuracion sin acceso al broker.
  reboot_timeout: 0s

  on_connect:
    - logger.log: ">> CONEXION MQTT ESTABLECIDA <<"
    - component.update: reloj_sntp

interval:
  - interval: 60s
    then:
      - lambda: |-
          ESP_LOGI("heap", "Free heap: %u bytes", ESP.getFreeHeap());

time:
  - platform: sntp
    id: reloj_sntp
    timezone: ${zona_horaria}
    servers: [0.pool.ntp.org, 1.pool.ntp.org]
    on_time:
      # Cada minuto se evalua el modo/plan de los 4 canales.
      - seconds: 0
        then:
          - script.execute: verificar_canales

# ===================================================================
# GLOBALS
# ===================================================================
globals:
  # Ultimo epoch valido: permite arrancar sin internet y conservar la hora.
  - id: g_last_epoch
    type: uint32_t
    restore_value: true
    initial_value: '0'

  # URL y MD5 del binario a instalar (los setea el handler MQTT de OTA).
  - id: ota_url
    type: std::string
    initial_value: '""'
  - id: ota_md5
    type: std::string
    initial_value: '""'

  # Override manual por canal: mientras dura un "accionar ahora", el plan
  # automatico no pisa el rele.
  - id: manual_c1
    type: bool
    initial_value: 'false'
  - id: manual_c2
    type: bool
    initial_value: 'false'
  - id: manual_c3
    type: bool
    initial_value: 'false'
  - id: manual_c4
    type: bool
    initial_value: 'false'

  # Guard: true mientras el firmware (plan, arranque, timed run) mueve el
  # rele. Si es false, el cambio vino de MQTT/boton y pasa el canal a manual.
  - id: auto_c1
    type: bool
    initial_value: 'false'
  - id: auto_c2
    type: bool
    initial_value: 'false'
  - id: auto_c3
    type: bool
    initial_value: 'false'
  - id: auto_c4
    type: bool
    initial_value: 'false'

# ===================================================================
# ESTADO (TEXT SENSORS)
# ===================================================================
text_sensor:
  # Version de firmware instalada (la lee la app como text_sensor_firmware_version)
  - platform: template
    name: "firmware_version"
    id: firmware_version
    update_interval: 60s
    icon: "mdi:numeric-1-box-multiple-outline"
    lambda: 'return {"${fw_version}"};'

# ===================================================================
# OTA REMOTO (actualizacion de firmware desde la app)
# ===================================================================
# La app publica en: <prefijo>/text/ota_firmware/command con "URL|MD5".
# El device reporta en <prefijo>/text/ota_status/state
#   ("descargando" | "error: ..." | "ok").
text:
  - platform: template
    name: "ota_firmware"
    id: ota_firmware
    optimistic: true
    mode: text
    max_length: 255
    on_value:
      - lambda: |-
          std::string cmd = x;
          std::string url;
          std::string md5;
          size_t sep = cmd.find('|');
          if (sep == std::string::npos) {
            url = cmd;
          } else {
            url = cmd.substr(0, sep);
            md5 = cmd.substr(sep + 1);
          }
          if (url.rfind("http://", 0) != 0 && url.rfind("https://", 0) != 0) {
            id(ota_status).publish_state("error: URL invalida");
            ESP_LOGW("ota", "URL de OTA invalida: %.50s", url.c_str());
            return;
          }
          if (md5.size() != 32) {
            id(ota_status).publish_state("error: MD5 invalido");
            ESP_LOGW("ota", "MD5 de OTA invalido (len=%u)", (unsigned) md5.size());
            return;
          }
          id(ota_url) = url;
          id(ota_md5) = md5;
          id(ota_status).publish_state("descargando");
          ESP_LOGI("ota", "OTA solicitado desde %s", url.c_str());
      - ota.http_request.flash:
          id: ota_http
          url: !lambda 'return id(ota_url);'
          md5: !lambda 'return id(ota_md5);'
      # Si llegamos aca fue porque el flash fallo (si tiene exito, reinicia).
      - lambda: 'id(ota_status).publish_state("error: flash fallo");'

  - platform: template
    name: "ota_status"
    id: ota_status
    optimistic: true
    mode: text
    max_length: 64

