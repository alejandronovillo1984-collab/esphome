captive_portal:

# Web server: solo útil cuando hay WiFi o AP activo (debug/OTA)
web_server:
  port: 80

# ── LoRa Telemetría periódica ────────────────────────────────────────────────
# Transmite cada 10 s el estado completo de la compuerta por radio.
interval:
  - interval: 10s
    then:
      - lambda: |-

          using namespace lora_custom;
          std::vector<uint8_t> pkt;

          // Magic number
          pkt.push_back(LORA_MAGIC_0);
          pkt.push_back(LORA_MAGIC_1);
          pkt.push_back(CMD_TELEMETRY);

          // GPS lat / lon
          push_float(pkt, id(htit_gnss_latitude).state);
          push_float(pkt, id(htit_gnss_longitude).state);

          // Batería
          push_float(pkt, id(bat_voltage).state);

          // Nivel de comida
          push_float(pkt, id(food_percentage).state);
          push_float(pkt, id(food_level).state);

          // Flags de estado (1 byte cada uno)
          pkt.push_back(id(gps_enabled).state ? 1 : 0); // index 23

          // Estado del ciclo de comida (0=inactiva, 1=bocina, 2=abriendo, 3=alimentando, 4=cerrando)
          uint8_t cycle_code = 0;
          std::string state_str = id(feeder_cycle_state).state;
          if (state_str == "BOCINA") cycle_code = 1;
          else if (state_str == "ABRIENDO") cycle_code = 2;
          else if (state_str == "ALIMENTANDO") cycle_code = 3;
          else if (state_str == "CERRANDO") cycle_code = 4;
          pkt.push_back(cycle_code); // index 24

          // Estado de la puerta (0=cerrada,1=abierta,2=abriendo,3=cerrando)
          uint8_t gate_st = 0;
          if (id(gate_cover).current_operation == cover::COVER_OPERATION_OPENING) gate_st = 2;
          else if (id(gate_cover).current_operation == cover::COVER_OPERATION_CLOSING) gate_st = 3;
          else if (id(gate_cover).is_fully_open()) gate_st = 1;
          pkt.push_back(gate_st); // index 25

          // Tipo de dispositivo (1 byte: 1 = Compuerta)
          pkt.push_back(0x01); // index 26

          // Sufijo único de dirección MAC (3 bytes) para identificar el dispositivo
          uint8_t mac[6];
          esp_read_mac(mac, ESP_MAC_WIFI_STA);
          pkt.push_back(mac[3]); // index 27
          pkt.push_back(mac[4]); // index 28
          pkt.push_back(mac[5]); // index 29

           // Nuevos campos extendidos (retrocompatible, a partir del index 30)
          // 1. Segundos configurados de bocina (float, 4 bytes) -> index 30
          push_float(pkt, id(bocina_secs_num).state);
          // 2. Minutos restantes de alimentación (float, 4 bytes) -> index 34
          push_float(pkt, id(time_left_alimenta).state);
          // 3. Tiempo de apertura configurado en minutos (float, 4 bytes) -> index 38
          push_float(pkt, id(food_open_mins_num).state);
          // 4. Altura del repositorio configurada en cm (float, 4 bytes) -> index 42
          push_float(pkt, id(altura_repositorio_num).state);
          // 5. Estado de pantalla (uint8_t, 1 byte) -> index 46
          pkt.push_back(id(display_status).state ? 1 : 0);
          // 6. Estado de alimentación GPS/Display (uint8_t, 1 byte) -> index 47
          pkt.push_back(id(power).state ? 1 : 0);
          // 7. Horarios programados (string variable) -> index 48+
          std::string sched_str = id(schedule_input).state;
          pkt.insert(pkt.end(), sched_str.begin(), sched_str.end());

          id(sx_module).transmit_packet(pkt);


          ESP_LOGI("lora_tx", "Telemetría enviada (%d bytes)", pkt.size());

  # Failsafe / Chequeo de seguridad periódico
  - interval: 10s
    then:
      - lambda: |-
          if (!id(run_feeding_routine_script).is_running() && id(routine_start_time) == 0) {
            std::string current_state = id(feeder_cycle_state).state;
            if (current_state == "ALIMENTANDO") {
              ESP_LOGW("failsafe", "Compuerta abierta (ALIMENTANDO) sin rutina activa. Forzando cierre de seguridad!");
              id(gate_cover).make_call().set_command_close().perform();
            }
          }

# https://esphome.io/components/time/
time:
  # https://esphome.io/components/time/homeassistant
  - platform: homeassistant
    id: homeassistant_time
    timezone: ${zona_horaria}
  # https://esphome.io/components/time/gps
    # Centralized offline scheduler on GPS clock
  - platform: gps
    id: gnss_time
    timezone: ${zona_horaria}
    on_time:
      - seconds: 0
        minutes: 0
        hours: "*"
        then:
          - lambda: |-
              if (!id(gnss_time).now().is_valid()) {
                ESP_LOGW("scheduler", "La hora GPS aun no esta sincronizada. Omitiendo programacion.");
                return;
              }
              std::string hour_str = std::to_string(id(gnss_time).now().hour);
              std::string sched = id(schedule_input).state;
              std::string search_target = "," + sched + ",";
              search_target.erase(std::remove_if(search_target.begin(), search_target.end(), ::isspace), search_target.end());
              if (search_target.find("," + hour_str + ",") != std::string::npos) {
                ESP_LOGI("scheduler", "Hora programada detectada (%s:00). Iniciando rutina de comida.", hour_str.c_str());
                id(run_feeding_routine_script).execute();
              }

# Light/LED
output:
  - platform: gpio
    id: light_output
    pin: GPIO18 # LED
  - platform: gpio
    id: gnss_rst_output
    pin: GPIO35 # GNSS_RST
    inverted: true

light:
  - platform: binary
    id: led
    name: "LED"
    output: light_output

# SPI Configuration
spi:
  # Display
  - id: spi_st7735
    clk_pin: GPIO41 # SCLK
    mosi_pin: GPIO42 # SDIN
  # LoRa
  - id: spi_sx126x
    clk_pin: GPIO9 # LoRa_SCK
    mosi_pin: GPIO10 # LoRa_MOSI
    miso_pin: GPIO11 # LoRa_MISO

# Display TFT ST7735
display:
  - platform: ili9xxx
    spi_id: spi_st7735
    model: st7735
    id: st7735
    cs_pin: GPIO38 # CS
    reset_pin: GPIO39 # RES
    dc_pin: GPIO40 # RS
    color_order: bgr
    invert_colors: true
    dimensions:
      width: 160
      height: 80
      offset_width: 1
      offset_height: 26
    transform:
      swap_xy: true
      mirror_y: true
      mirror_x: false
    data_rate: 40MHz
    auto_clear_enabled: true
    lambda: |-
      // Fila 1: Solo ID y a la derecha la hora completa (hh:mm:ss)
      std::string full_name = App.get_name();
      std::string id_suffix = full_name.length() > 6 ? full_name.substr(full_name.length() - 6) : full_name;
      
      char buf_left[16];
      snprintf(buf_left, sizeof(buf_left), "ID: %s", id_suffix.c_str());
      it.print(0, 0, id(font_small), id(white), buf_left);

      std::string time_clock_str = "---";
      auto now = id(homeassistant_time).now();
      if (!now.is_valid()) {
        now = id(gnss_time).now();
      }
      if (now.is_valid()) {
        char buf_time[10];
        now.strftime(buf_time, sizeof(buf_time), "%H:%M:%S");
        time_clock_str = buf_time;
      }
      it.print(160, 0, id(font_small), id(white), TextAlign::TOP_RIGHT, time_clock_str.c_str());

      // Fila 2: Estado de la Rutina (Grande en el Medio)
      std::string state_str = id(feeder_cycle_state).state;
      Color state_color = id(white);
      if (state_str == "BOCINA") state_color = id(yellow);
      else if (state_str == "ABRIENDO") state_color = id(blue);
      else if (state_str == "ALIMENTANDO") state_color = id(green);
      else if (state_str == "CERRANDO") state_color = id(red);
      it.print(80, 28, id(font_large), state_color, TextAlign::CENTER, state_str.c_str());

      // Fila 3: Un poco más abajo centrado la capacidad de comida (o fase activa si corre la rutina)
      float food_pct = id(food_percentage).state;
      char buf_center[32];
      
      if (id(run_feeding_routine_script).is_running() && id(routine_start_time) != 0) {
        uint32_t elapsed = (millis() / 1000) - id(routine_start_time);
        uint32_t bocina_s = (uint32_t)id(bocina_secs_num).state;
        uint32_t travel_s = (uint32_t)id(gate_travel_time_num).state;
        uint32_t open_s = (uint32_t)id(food_open_mins_num).state * 60;
        
        std::string phase = "Bocina";
        uint32_t phase_rem = 0;
        if (elapsed < bocina_s) {
          phase = "Bocina";
          phase_rem = bocina_s - elapsed;
        } else if (elapsed < bocina_s + travel_s) {
          phase = "Abriendo";
          phase_rem = (bocina_s + travel_s) - elapsed;
        } else if (elapsed < bocina_s + travel_s + open_s) {
          phase = "Abierta";
          phase_rem = (bocina_s + travel_s + open_s) - elapsed;
        } else {
          phase = "Cerrando";
          uint32_t total_s = bocina_s + 2 * travel_s + open_s;
          phase_rem = total_s > elapsed ? total_s - elapsed : 0;
        }
        if (phase_rem >= 3600) {
          snprintf(buf_center, sizeof(buf_center), "%s: %dh%dm", phase.c_str(), phase_rem / 3600, (phase_rem % 3600) / 60);
        } else if (phase_rem >= 60) {
          snprintf(buf_center, sizeof(buf_center), "%s: %dm%ds", phase.c_str(), phase_rem / 60, phase_rem % 60);
        } else {
          snprintf(buf_center, sizeof(buf_center), "%s: %ds", phase.c_str(), phase_rem);
        }
      } else {
        snprintf(buf_center, sizeof(buf_center), "Comida: %.0f%%", std::isnan(food_pct) ? 0.0 : food_pct);
      }
      it.print(80, 48, id(font_small), id(white), TextAlign::CENTER, buf_center);

      // Fila 4: Cierra a la derecha la próxima comida (o fin de rutina)
      char buf_right[32];
      if (id(run_feeding_routine_script).is_running() && id(routine_start_time) != 0) {
        uint32_t elapsed = (millis() / 1000) - id(routine_start_time);
        uint32_t bocina_s = (uint32_t)id(bocina_secs_num).state;
        uint32_t travel_s = (uint32_t)id(gate_travel_time_num).state;
        uint32_t open_s = (uint32_t)id(food_open_mins_num).state * 60;
        uint32_t total_s = bocina_s + 2 * travel_s + open_s;
        uint32_t rem = total_s > elapsed ? total_s - elapsed : 0;
        
        if (rem >= 3600) {
          snprintf(buf_right, sizeof(buf_right), "Fin: %dh%dm", rem / 3600, (rem % 3600) / 60);
        } else if (rem >= 60) {
          snprintf(buf_right, sizeof(buf_right), "Fin: %dm%ds", rem / 60, rem % 60);
        } else {
          snprintf(buf_right, sizeof(buf_right), "Fin: %ds", rem);
        }
      } else {
        std::string next_str = "--";
        if (now.is_valid()) {
          int sec_left = lora_custom::get_seconds_to_next_feeding(now.hour, now.minute, now.second, id(schedule_input).state);
          if (sec_left >= 0) {
            int h = sec_left / 3600;
            int m = (sec_left % 3600) / 60;
            char buf_next[16];
            if (h > 0) {
              snprintf(buf_next, sizeof(buf_next), "%dh%dm", h, m);
            } else {
              snprintf(buf_next, sizeof(buf_next), "%dm", m);
            }
            next_str = buf_next;
          }
        }
        snprintf(buf_right, sizeof(buf_right), "Prox: %s", next_str.c_str());
      }
      it.print(160, 79, id(font_small), id(white), TextAlign::BOTTOM_RIGHT, buf_right);

# Fonts
