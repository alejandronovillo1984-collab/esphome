    icon: "mdi:timer-outline"
    min_value: 1
    max_value: 60
    step: 1
    mode: box
    optimistic: true
    restore_value: true
    initial_value: 5

  # Altura del repositorio en cm para el calculo del porcentaje
  - platform: template
    id: altura_repositorio_num
    name: "Altura Repositorio (cm)"
    icon: "mdi:arrow-up-down"
    min_value: 20
    max_value: 300
    step: 5
    mode: box
    optimistic: true
    restore_value: true
    initial_value: 100

  # Offset del sensor de comida en cm (ciego de lectura)
  - platform: template
    id: food_offset_num
    name: "Offset Sensor Comida (cm)"
    icon: "mdi:ruler"
    min_value: 5
    max_value: 50
    step: 1
    mode: box
    optimistic: true
    restore_value: true
