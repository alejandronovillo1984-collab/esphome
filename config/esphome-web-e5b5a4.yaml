# User-configurable string representing feeding schedule
text:
  # Horas de alimentación separadas por comas (ej. "8,12,18")
  - platform: template
    id: schedule_input
    name: "Horarios de Comida (h)"
    icon: "mdi:calendar-clock"
    mode: text
    optimistic: true
    restore_value: true
    initial_value: "8,12,18"
    min_length: 1
    max_length: 64

# Automated feeding routine sequence script
script:
  - id: run_feeding_routine_script
    mode: single # Evita ejecuciones superpuestas
    then:
      - logger.log: "Iniciando rutina automatica de comida..."
      - lambda: |-
          id(routine_start_time) = millis() / 1000;
      # 1. Enciende la bocina para llamar a las vacas
      - switch.turn_on: bocina_relay
      # 2. Espera la cantidad de segundos configurados por el usuario
      - delay: !lambda "return (int)id(bocina_secs_num).state * 1000;"
      # 3. Apaga la bocina
      - switch.turn_off: bocina_relay
      - delay: 500ms
      # 4. Abre la compuerta del comedero
      - cover.open: gate_cover
      # Espera a que complete el recorrido de apertura
      - delay: !lambda "return (int)id(gate_travel_time_num).state * 1000;"
      # 5. La mantiene abierta monitoreando activamente el tiempo restante
      - while:
          condition:
            lambda: |-
              return id(time_left_alimenta).state > 0.0f;
          then:
            - delay: 1s
      # 6. Cierra la compuerta
      - cover.close: gate_cover

      # Espera a que complete el recorrido de cierre
      - delay: !lambda "return (int)id(gate_travel_time_num).state * 1000;"
      - lambda: |-
          id(routine_start_time) = 0;
      - logger.log: "Rutina automatica de comida finalizada con exito."

  # Script para la accion de abrir la compuerta
  - id: open_gate_script
    mode: restart
    then:
      - switch.turn_off: close_switch
      - delay: 50ms
      - switch.turn_on: open_switch
      - delay: !lambda "return (int)id(gate_travel_time_num).state * 1000;"
      - switch.turn_off: open_switch

  # Script para la accion de cerrar la compuerta
  - id: close_gate_script
    mode: restart
    then:
      - switch.turn_off: open_switch
      - delay: 50ms
      - switch.turn_on: close_switch
      - delay: !lambda "return (int)id(gate_travel_time_num).state * 1000;"
      - switch.turn_off: close_switch

# LoRa Module (SX1262)
sx126x:
  id: sx_module
  spi_id: spi_sx126x
  hw_version: sx1262
  cs_pin: GPIO8 # LoRa_NSS
  rst_pin: GPIO12 # LoRa_RST
  busy_pin: GPIO13 # LoRa_BUSY
  dio1_pin: GPIO14 # DIO1
  frequency: 863000000
  modulation: LORA
  rf_switch: true
  pa_power: 3
  tcxo_voltage: 1_7V
  crc_enable: true
  on_packet:
    then:
      - lambda: |-
          using namespace lora_custom;
          ESP_LOGD("lora_rx", "Paquete recibido (%d bytes) RSSI:%.1f SNR:%.1f",
                   (int)x.size(), rssi, snr);
          ESP_LOGD("lora_rx", "raw: %s", format_hex(x).c_str());

          if (!is_valid_packet(x)) {
            ESP_LOGW("lora_rx", "Paquete inválido (magic incorrecto), ignorado.");
            return;
          }

          uint8_t cmd_or_mac = x[2];

          // ── 0x01 Telemetría de otro dispositivo ───────────────────────────
          if (cmd_or_mac == CMD_TELEMETRY) {
            // Paquete de telemetría de otro nodo - solo logueamos
            if (x.size() >= 30) {
              float rem_lat  = pop_float(x, 3);
              float rem_lon  = pop_float(x, 7);
              float rem_bat  = pop_float(x, 11);
              float rem_food = pop_float(x, 15);
              ESP_LOGI("lora_rx", "Telemetría remota recibida: lat=%.4f lon=%.4f bat=%.2fV food=%.0f%%",
                       rem_lat, rem_lon, rem_bat, rem_food);
            }
            return;
          }

          // ── Comandos de control con direccionamiento MAC ──────────────────
          // Formato: [Magic 2B][Target MAC 3B][CMD 1B][Payload...]
          if (x.size() < 6) {
            ESP_LOGW("lora_rx", "Paquete de comando demasiado corto (%d bytes)", (int)x.size());
            return;
          }

          // Obtener MAC local
          uint8_t my_mac[6];
          esp_read_mac(my_mac, ESP_MAC_WIFI_STA);

          // Verificar si el comando es para nosotros o broadcast (FFFFFF)
          bool is_broadcast = (x[2] == 0xFF && x[3] == 0xFF && x[4] == 0xFF);
          bool is_target = (x[2] == my_mac[3] && x[3] == my_mac[4] && x[4] == my_mac[5]);

          if (!is_broadcast && !is_target) {
            ESP_LOGD("lora_rx", "Comando para otro dispositivo (%02x%02x%02x), ignorado.", x[2], x[3], x[4]);
            return;
          }

          uint8_t cmd = x[5];
          ESP_LOGI("lora_rx", "Procesando comando 0x%02X (%s)", cmd, is_broadcast ? "broadcast" : "dirigido");

          // CMD 0x10: Habilitar/Deshabilitar GPS
          if (cmd == CMD_SET_GPS && x.size() >= 7) {
            if (x[6]) { id(gps_enabled).turn_on();  ESP_LOGI("lora_cmd", "GPS activado"); }
            else       { id(gps_enabled).turn_off(); ESP_LOGI("lora_cmd", "GPS desactivado"); }
            return;
          }

          // CMD 0x11: Tiempo apertura comida (float minutos)
          if (cmd == CMD_SET_FOOD_SECS && x.size() >= 10) {
            float val = pop_float(x, 6);
            auto call = id(food_open_mins_num).make_call();
            call.set_value(val);
            call.perform();
            ESP_LOGI("lora_cmd", "food_open_mins ajustado a %.0f min", val);
            return;
          }

          // CMD 0x12: Tiempo bocina (float segundos)
          if (cmd == CMD_SET_BOCINA_SECS && x.size() >= 10) {
            float val = pop_float(x, 6);
            auto call = id(bocina_secs_num).make_call();
            call.set_value(val);
            call.perform();
            ESP_LOGI("lora_cmd", "bocina_secs ajustado a %.0f s", val);
            return;
          }

          // CMD 0x13: Altura repositorio (float cm)
          if (cmd == CMD_SET_ALTURA_REPO && x.size() >= 10) {
            float val = pop_float(x, 6);
            auto call = id(altura_repositorio_num).make_call();
            call.set_value(val);
            call.perform();
            ESP_LOGI("lora_cmd", "altura_repo ajustada a %.0f cm", val);
            return;
          }

          // CMD 0x14: Horario comida (string ASCII, sin nulo terminal)
          if (cmd == CMD_SET_SCHEDULE && x.size() >= 7) {
            std::string sched(x.begin() + 6, x.end());
            id(schedule_input).publish_state(sched);
            ESP_LOGI("lora_cmd", "schedule ajustado: %s", sched.c_str());
            return;
          }

          // CMD 0x20: Abrir compuerta
          if (cmd == CMD_OPEN_GATE) {
            auto call = id(gate_cover).make_call();
            call.set_command_open();
            call.perform();
            ESP_LOGI("lora_cmd", "Compuerta: ABRIR");
            return;
          }

          // CMD 0x21: Cerrar compuerta
          if (cmd == CMD_CLOSE_GATE) {
            auto call = id(gate_cover).make_call();
            call.set_command_close();
            call.perform();
            ESP_LOGI("lora_cmd", "Compuerta: CERRAR");
            return;
          }

          // CMD 0x22: Detener compuerta
          if (cmd == CMD_STOP_GATE) {
            auto call = id(gate_cover).make_call();
            call.set_command_stop();
            call.perform();
            ESP_LOGI("lora_cmd", "Compuerta: DETENER");
            return;
          }

          // CMD 0x23: Iniciar rutina de comida
          if (cmd == CMD_FEED_ROUTINE) {
            id(run_feeding_routine_script).execute();
            ESP_LOGI("lora_cmd", "Rutina de comida iniciada por LoRa");
            return;
          }

          // CMD 0x24: Sonar bocina 3 segundos
          if (cmd == CMD_HORN_3S) {
            id(bocina_relay).turn_on();
            delay(3000);
            id(bocina_relay).turn_off();
            ESP_LOGI("lora_cmd", "Bocina sonada 3s por LoRa");
            return;
          }

          // CMD 0x30: Reiniciar dispositivo
          if (cmd == CMD_RESTART) {
            ESP_LOGW("lora_cmd", "Reiniciando por comando LoRa...");
            App.safe_reboot();
            return;
          }

          // CMD 0x40: Set Display status (ON/OFF)
          if (cmd == CMD_SET_DISPLAY && x.size() >= 7) {
            if (x[6]) {
              id(display_status).turn_on();
            } else {
              id(display_status).turn_off();
            }
            ESP_LOGI("lora_cmd", "Display %s por LoRa", x[6] ? "encendido" : "apagado");
            return;
          }

          // CMD 0x41: Set Power rail status (ON/OFF)
          if (cmd == CMD_SET_POWER && x.size() >= 7) {
            if (x[6]) {
              id(power).turn_on();
            } else {
              id(power).turn_off();
            }
            ESP_LOGI("lora_cmd", "Power %s por LoRa", x[6] ? "encendido" : "apagado");
            return;
          }


          ESP_LOGW("lora_rx", "CMD desconocido: 0x%02X", cmd);

# GNSS UART
uart:
  id: uart_gnss
  tx_pin: GPIO34 # GNSS_RX
  rx_pin: GPIO33 # GNSS_TX
  baud_rate: 115200

# GPS Component
gps:
  latitude:
    name: "Latitude"
    id: htit_gnss_latitude
  longitude:
    name: "Longitude"
    id: htit_gnss_longitude
  altitude:
    name: "Altitude"
    id: htit_gnss_altitude
  speed:
    name: "Speed"
    id: htit_gnss_speed
  course:
    name: "Course"
    id: htit_gnss_course
  satellites:
    name: "Satellites"
    id: htit_gnss_satellites
  hdop:
    name: "HDOP"
    id: htit_gnss_hdop
  update_interval: 5s

# Buttons
button:
  - platform: restart
    name: "Restart"
  - platform: shutdown
    name: "Shutdown"
  - platform: safe_mode
    name: "Safe Mode Boot"
  - platform: output
    id: reset_gnss
    name: "Reset GNSS"
    output: gnss_rst_output
    duration: 1ms
    entity_category: config

  # Botón Iniciar Rutina de Comida Manual
  - platform: template
    name: "Iniciar Rutina Comida"
    id: start_routine_button
    icon: "mdi:cow"
    on_press:
      - script.execute: run_feeding_routine_script

  # Botón Sonar Bocina Manual (3 segundos)
  - platform: template
    name: "Sonar Bocina (3s)"
    icon: "mdi:volume-high"
    on_press:
      - switch.turn_on: bocina_relay
      - delay: 3s
      - switch.turn_off: bocina_relay

# User button
binary_sensor:
  - platform: gpio
    id: user_button
    name: "USER Button"
    pin:
      number: GPIO0
      mode: INPUT_PULLUP
      inverted: true
    on_press:
      - if:
          condition:
            wifi.enabled:
          then:
            - wifi.disable:
            - logger.log: "WiFi Deshabilitado por Botón Físico"
          else:
            - wifi.enable:
            - logger.log: "WiFi Habilitado por Botón Físico"

# Text Sensors (WiFi info & Date/Time)
text_sensor:
  - platform: wifi_info
    ip_address:
      name: "IP Address"
      id: wifi_ip
    ssid:
      name: "SSID"
      id: wifi_ssid_sensor

  - platform: template
    name: "Comedero Estado Ciclo"
    id: feeder_cycle_state
    icon: "mdi:clock-fast"
    update_interval: 1s
    lambda: |-
      if (id(run_feeding_routine_script).is_running() && id(routine_start_time) != 0) {
        uint32_t elapsed = (millis() / 1000) - id(routine_start_time);
        uint32_t bocina_s = (uint32_t)id(bocina_secs_num).state;
        uint32_t travel_s = (uint32_t)id(gate_travel_time_num).state;
        uint32_t open_s = (uint32_t)id(food_open_mins_num).state * 60;
        
        if (elapsed < bocina_s) return {"BOCINA"};
        if (elapsed < bocina_s + travel_s) return {"ABRIENDO"};
        if (elapsed < bocina_s + travel_s + open_s) return {"ALIMENTANDO"};
        return {"CERRANDO"};
      } else {
        if (id(gate_cover).current_operation == cover::COVER_OPERATION_OPENING) {
          return {"ABRIENDO"};
        } else if (id(gate_cover).current_operation == cover::COVER_OPERATION_CLOSING) {
          return {"CERRANDO"};
        } else if (id(gate_cover).is_fully_open()) {
          return {"ALIMENTANDO"};
        } else {
          return {"INACTIVA"};
        }
      }

  - platform: template
    name: "Comedero Fecha Hora"
    id: date_time_sensor
    icon: "mdi:clock"
    update_interval: 1s
    lambda: |-
      auto now = id(homeassistant_time).now();
      if (!now.is_valid()) {
        now = id(gnss_time).now();
      }
      if (!now.is_valid()) {
        return {"Sin Sincronizar"};
      }
      char buf[30];
      now.strftime(buf, sizeof(buf), "%d/%m/%Y %H:%M:%S");
      return {buf};
