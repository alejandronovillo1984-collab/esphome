# https://heltec.org/project/wireless-tracker/
# https://docs.heltec.org/en/node/esp32/wireless_tracker/index.html
# https://resource.heltec.cn/download/Wireless_Tracker/Wireless%20Tracker1.1.pdf
# https://resource.heltec.cn/download/Wireless_Tracker/Wireless_Tacker1.1/HTIT-Tracker_V0.5.pdf

substitutions:
  name: "esphome-web-e5b5a4"
  friendly_name: "Heltec Compuerta"
  zona_horaria: "America/Argentina/Buenos_Aires"

preferences:
  flash_write_interval: 10s

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  name_add_mac_suffix: false
  includes:
    - lora_helpers.h
  on_boot:
    - priority: 900.0
      then:
        - switch.turn_on: display_status
    - priority: -100.0
      then:
        - delay: 500ms
        - button.press: reset_gnss

globals:
  - id: routine_start_time
    type: uint32_t
    initial_value: "0"

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: arduino

# Enable logging
logger:

# Enable Home Assistant API
api:
  encryption:
    key: "RM7K+/od/u4DwpYI/2uIAGjyxoteIbjMwFJSLsoF4Ck="

ota:
  - platform: esphome
    password: "a07f0ecafb9903e33bc48562d36e3616"

wifi:
  id: wifi_comp
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # CAMPO: nunca reiniciar por falta de WiFi
  reboot_timeout: 0s

  # Reduce consumo cuando hay conexión
  power_save_mode: HIGH

  # Conexión más rápida si la red está disponible
