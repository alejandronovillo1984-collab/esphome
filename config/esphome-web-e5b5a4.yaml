# Switches and Controls
switch:
  # Power (Display & GNSS)
  - platform: gpio
    id: power
    name: "Power (Display & GNSS)"
    restore_mode: RESTORE_DEFAULT_OFF
    pin:
      number: GPIO3
      inverted: true
      mode:
        output: true
        pulldown: true
  # Display status
  - platform: gpio
    id: display_status
    name: "Display Status"
    restore_mode: RESTORE_DEFAULT_ON
    pin:
      number: GPIO21
      mode: OUTPUT
  # Charge Control
  - platform: gpio
    id: charge_control
    name: "Charge Control"
    restore_mode: RESTORE_DEFAULT_ON
    pin:
      number: GPIO2
      mode: OUTPUT

  # L298N H-Bridge Motor Direction Switches
  - platform: gpio
    pin: GPIO6
    id: open_switch
    name: "Motor Abrir (IN1)"
    interlock: [close_switch]
    restore_mode: ALWAYS_OFF
  - platform: gpio
    pin: GPIO7
    id: close_switch
    name: "Motor Cerrar (IN2)"
    interlock: [open_switch]
    restore_mode: ALWAYS_OFF

  # Relay Bocina Adiestramiento
  - platform: gpio
    pin: GPIO15
    id: bocina_relay
    name: "Bocina Adiestramiento"
    icon: "mdi:bullhorn"
    restore_mode: ALWAYS_OFF

  # Habilitar/Deshabilitar GPS (Hardware reset para bajo consumo)
  - platform: template
    name: "GPS Habilitado"
    id: gps_enabled
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    turn_on_action:
      - output.turn_off: gnss_rst_output # Libera reset (enciende GNSS)
      - logger.log: "GNSS Hardware Activado"
    turn_off_action:
      - output.turn_on: gnss_rst_output # Mantiene reset (apaga GNSS)
      - logger.log: "GNSS Hardware Desactivado"

# Cover component representing the feeder door
cover:
  - platform: template
    name: "Puerta Comedero"
    id: gate_cover
    optimistic: true
    assumed_state: true
    restore_mode: NO_RESTORE
    open_action:
      - script.execute: open_gate_script
    close_action:
      - script.execute: close_gate_script
    stop_action:
      - script.stop: open_gate_script
      - script.stop: close_gate_script
      - switch.turn_off: open_switch
      - switch.turn_off: close_switch

# Sensors (Battery, Ultrasonic, and Template Configuration)
sensor:
  # Uptime
  - platform: uptime
    id: last_boot
    type: timestamp
    name: "Last Boot (Uptime)"

  # Battery Voltage
  - platform: adc
    id: bat_voltage
    name: "BAT Voltage"
    pin: GPIO1
    attenuation: 12db
    accuracy_decimals: 3
    samples: 3
    update_interval: 1min
    filters:
      - multiply: 4.8837

  # HC-SR04 Ultrasonic Sensor for Food Level
  - platform: ultrasonic
    trigger_pin: GPIO4
    echo_pin: GPIO5
    name: "Comedero Distancia Comida"
    id: food_level
    update_interval: 10s
    accuracy_decimals: 1
    unit_of_measurement: "cm"
    filters:
      - multiply: 100.0

  # Food Level Percentage Sensor
  - platform: template
    name: "Comedero Nivel Comida"
    id: food_percentage
    unit_of_measurement: "%"
    accuracy_decimals: 0
    icon: "mdi:percent"
    update_interval: 10s
    lambda: |-
      float dist = id(food_level).state; // en cm
      float total_height = id(altura_repositorio_num).state; // en cm
      float offset = id(food_offset_num).state; // en cm, default 20
      if (std::isnan(dist) || total_height <= 0) {
        return {};
      }
      if (dist >= total_height) {
        return 0.0;
      }
      if (dist <= offset) { // Blind spot / 100% full limit
        return 100.0;
      }
      float percent = ((total_height - dist) / (total_height - offset)) * 100.0;
      if (percent < 0.0) percent = 0.0;
      if (percent > 100.0) percent = 100.0;
      return percent;

  # Tiempo Restante de Alimentacion en minutos (cuenta regresiva)
  - platform: template
    name: "Tiempo Restante Alimentacion"
    id: time_left_alimenta
    unit_of_measurement: "min"
    accuracy_decimals: 1
    icon: "mdi:timer-sand"
    update_interval: 1s
    lambda: |-
      if (id(run_feeding_routine_script).is_running() && id(routine_start_time) != 0) {
        uint32_t elapsed = (millis() / 1000) - id(routine_start_time);
        uint32_t bocina_s = (uint32_t)id(bocina_secs_num).state;
        uint32_t travel_s = (uint32_t)id(gate_travel_time_num).state;
        uint32_t open_s = (uint32_t)id(food_open_mins_num).state * 60;
        uint32_t total_active_s = bocina_s + travel_s + open_s;
        if (elapsed < total_active_s) {
          return (float)(total_active_s - elapsed) / 60.0f;
        }
      }
      return 0.0f;


# User-configurable Numbers (sliders as inputs) for the routine
number:
  # Tiempo de Apertura de Comida en minutos
  - platform: template
    id: food_open_mins_num
