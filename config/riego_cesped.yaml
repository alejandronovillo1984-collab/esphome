# ===================================================================
# SCRIPTS
# ===================================================================
script:
  # Evalua horarios de las 4 zonas cada minuto. Encola las zonas cuyo horario
  # coincide y arranca una por vez (secuencial).
  - id: verificar_zonas
    mode: single
    then:
      - lambda: |-
          auto t = id(reloj_sntp).now();
          if (!t.is_valid()) return;

          // Guardar el epoch cada 10 min para no castigar la flash.
          if (t.minute % 10 == 0) id(g_last_epoch) = (uint32_t) t.timestamp;

          switch_::Switch *activas[4] = {id(activa_z1), id(activa_z2), id(activa_z3), id(activa_z4)};
          switch_::Switch *forzados[4] = {id(forzado_z1), id(forzado_z2), id(forzado_z3), id(forzado_z4)};
          switch_::Switch *relays[4] = {id(relay_z1), id(relay_z2), id(relay_z3), id(relay_z4)};
          uint32_t *last[4] = {&id(g_last_key1), &id(g_last_key2), &id(g_last_key3), &id(g_last_key4)};
          bool *pending[4] = {&id(g_pending1), &id(g_pending2), &id(g_pending3), &id(g_pending4)};
          std::string horarios[4] = {id(horario_z1).state, id(horario_z2).state,
                                     id(horario_z3).state, id(horario_z4).state};
          bool running[4] = {id(ejecutar_z1).is_running(), id(ejecutar_z2).is_running(),
                             id(ejecutar_z3).is_running(), id(ejecutar_z4).is_running()};

          // Seguridad: si un rele quedo encendido sin script en curso ni forzado,
          // se apaga (evita que un ON manual por MQTT quede abierto para siempre).
          for (int i = 0; i < 4; i++) {
            if (relays[i]->state && !running[i] && !forzados[i]->state) {
              relays[i]->turn_off();
              ESP_LOGW("cesped", "Zona %d OFF (rele encendido sin rutina)", i + 1);
            }
          }

          if (!id(programador_activo).state) {
            id(g_pending1) = false;
            id(g_pending2) = false;
            id(g_pending3) = false;
            id(g_pending4) = false;
            return;
          }

          int hour = t.hour;
          int minute = t.minute;
          uint32_t now = (uint32_t) t.timestamp;

          // Parseo de horarios: "6,18,20" (hora exacta) o "6:30,18:00".
          auto sched_hit = [&](const std::string &s, uint32_t &key) -> bool {
            size_t pos = 0;
            while (pos <= s.size()) {
              size_t comma = s.find(',', pos);
              std::string tok = s.substr(pos, (comma == std::string::npos) ? std::string::npos : comma - pos);
              size_t b = tok.find_first_not_of(" \t");
              size_t e = tok.find_last_not_of(" \t");
              if (b != std::string::npos) {
                tok = tok.substr(b, e - b + 1);
                size_t colon = tok.find(':');
                if (colon != std::string::npos) {
                  int hh = atoi(tok.substr(0, colon).c_str());
                  int mm = atoi(tok.substr(colon + 1).c_str());
                  if (hh == hour && mm == minute) {
                    key = now / 60;  // clave por minuto
                    return true;
                  }
                } else {
                  int hh = atoi(tok.c_str());
                  if (hh == hour) {
                    key = now / 3600;  // clave por hora
                    return true;
                  }
                }
              }
              if (comma == std::string::npos) break;
              pos = comma + 1;
            }
            return false;
          };

          // Marcar como pendientes las zonas cuyo horario coincide y que no
          // se hayan disparado ya en esta misma hora/minuto.
          for (int i = 0; i < 4; i++) {
            if (!activas[i]->state || forzados[i]->state) {
              *pending[i] = false;
              continue;
            }
            uint32_t key = 0;
            if (sched_hit(horarios[i], key) && *last[i] != key) {
              *last[i] = key;
              *pending[i] = true;
              ESP_LOGI("cesped", "Zona %d programada (%02d:%02d)", i + 1, hour, minute);
            }
          }

          // Si hay cualquier zona regando o un script en curso, esperar.
          bool busy = false;
          for (int i = 0; i < 4; i++) {
            if (relays[i]->state || forzados[i]->state || running[i]) busy = true;
          }
          if (busy) return;

          // Arrancar la primera zona pendiente.
          for (int i = 0; i < 4; i++) {
            if (*pending[i] && activas[i]->state && !forzados[i]->state) {
              *pending[i] = false;
              switch (i) {
                case 0: id(ejecutar_z1).execute(); break;
                case 1: id(ejecutar_z2).execute(); break;
                case 2: id(ejecutar_z3).execute(); break;
                case 3: id(ejecutar_z4).execute(); break;
              }
              break;
            }
          }

  # Riego de la zona 1 durante la duracion configurada.
  - id: ejecutar_z1
    mode: single
    then:
      - if:
          condition:
            switch.is_on: forzado_z1
          then:
            - logger.log: "Zona 1 en forzado manual; riego omitido"
          else:
            - switch.turn_on: relay_z1
            - delay: !lambda "return (uint32_t)(id(duracion_z1).state * 60000.0f);"
            - switch.turn_off: relay_z1

  - id: ejecutar_z2
    mode: single
    then:
      - if:
          condition:
            switch.is_on: forzado_z2
          then:
            - logger.log: "Zona 2 en forzado manual; riego omitido"
          else:
            - switch.turn_on: relay_z2
            - delay: !lambda "return (uint32_t)(id(duracion_z2).state * 60000.0f);"
            - switch.turn_off: relay_z2

  - id: ejecutar_z3
    mode: single
    then:
      - if:
          condition:
            switch.is_on: forzado_z3
          then:
            - logger.log: "Zona 3 en forzado manual; riego omitido"
          else:
            - switch.turn_on: relay_z3
            - delay: !lambda "return (uint32_t)(id(duracion_z3).state * 60000.0f);"
            - switch.turn_off: relay_z3

  - id: ejecutar_z4
    mode: single
    then:
      - if:
          condition:
            switch.is_on: forzado_z4
          then:
            - logger.log: "Zona 4 en forzado manual; riego omitido"
          else:
            - switch.turn_on: relay_z4
            - delay: !lambda "return (uint32_t)(id(duracion_z4).state * 60000.0f);"
            - switch.turn_off: relay_z4
