    icon: "mdi:timer-outline"

# ===================================================================
# SWITCHES: RELES + ZONA ACTIVA + FORZADO MANUAL
# ===================================================================
switch:
  # ---- Zona 1 ----
  - platform: gpio
    pin: ${pin_r1}
    id: relay_z1
    name: "${dev_name} zona 1 relay"
    restore_mode: ALWAYS_OFF
    inverted: ${relay_inverted}
    icon: "mdi:electric-switch"
    on_turn_on:
      - logger.log: "Zona 1: relay ON"
    on_turn_off:
      - logger.log: "Zona 1: relay OFF"

  - platform: template
    name: "${dev_name} zona 1 activa"
    id: activa_z1
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    icon: "mdi:toggle-switch"
    turn_on_action:
      - logger.log: "Zona 1 habilitada"
      - script.execute: verificar_zonas
    turn_off_action:
      - script.stop: ejecutar_z1
      - switch.turn_off: forzado_z1
      - switch.turn_off: relay_z1
      - lambda: 'id(g_pending1) = false;'
      - logger.log: "Zona 1 deshabilitada"

  - platform: template
    name: "${dev_name} zona 1 forzado manual"
    id: forzado_z1
    optimistic: true
    restore_mode: ALWAYS_OFF
    icon: "mdi:hand-back-right"
    turn_on_action:
      - script.stop: ejecutar_z1
      - switch.turn_on: relay_z1
      - logger.log: "Zona 1 forzado manual ON"
    turn_off_action:
      - script.stop: ejecutar_z1
      - switch.turn_off: relay_z1
      - logger.log: "Zona 1 forzado manual OFF"

  # ---- Zona 2 ----
  - platform: gpio
    pin: ${pin_r2}
    id: relay_z2
    name: "${dev_name} zona 2 relay"
    restore_mode: ALWAYS_OFF
    inverted: ${relay_inverted}
    icon: "mdi:electric-switch"
    on_turn_on:
      - logger.log: "Zona 2: relay ON"
    on_turn_off:
      - logger.log: "Zona 2: relay OFF"

  - platform: template
    name: "${dev_name} zona 2 activa"
    id: activa_z2
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    icon: "mdi:toggle-switch"
    turn_on_action:
      - logger.log: "Zona 2 habilitada"
      - script.execute: verificar_zonas
    turn_off_action:
      - script.stop: ejecutar_z2
      - switch.turn_off: forzado_z2
      - switch.turn_off: relay_z2
      - lambda: 'id(g_pending2) = false;'
      - logger.log: "Zona 2 deshabilitada"

  - platform: template
    name: "${dev_name} zona 2 forzado manual"
    id: forzado_z2
    optimistic: true
    restore_mode: ALWAYS_OFF
    icon: "mdi:hand-back-right"
    turn_on_action:
      - script.stop: ejecutar_z2
      - switch.turn_on: relay_z2
      - logger.log: "Zona 2 forzado manual ON"
    turn_off_action:
      - script.stop: ejecutar_z2
      - switch.turn_off: relay_z2
      - logger.log: "Zona 2 forzado manual OFF"

  # ---- Zona 3 ----
  - platform: gpio
    pin: ${pin_r3}
    id: relay_z3
    name: "${dev_name} zona 3 relay"
    restore_mode: ALWAYS_OFF
    inverted: ${relay_inverted}
    icon: "mdi:electric-switch"
    on_turn_on:
      - logger.log: "Zona 3: relay ON"
    on_turn_off:
      - logger.log: "Zona 3: relay OFF"

  - platform: template
    name: "${dev_name} zona 3 activa"
    id: activa_z3
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    icon: "mdi:toggle-switch"
    turn_on_action:
      - logger.log: "Zona 3 habilitada"
      - script.execute: verificar_zonas
    turn_off_action:
      - script.stop: ejecutar_z3
      - switch.turn_off: forzado_z3
      - switch.turn_off: relay_z3
      - lambda: 'id(g_pending3) = false;'
      - logger.log: "Zona 3 deshabilitada"

  - platform: template
    name: "${dev_name} zona 3 forzado manual"
    id: forzado_z3
    optimistic: true
    restore_mode: ALWAYS_OFF
    icon: "mdi:hand-back-right"
    turn_on_action:
      - script.stop: ejecutar_z3
      - switch.turn_on: relay_z3
      - logger.log: "Zona 3 forzado manual ON"
    turn_off_action:
      - script.stop: ejecutar_z3
      - switch.turn_off: relay_z3
      - logger.log: "Zona 3 forzado manual OFF"

  # ---- Zona 4 ----
  - platform: gpio
    pin: ${pin_r4}
    id: relay_z4
    name: "${dev_name} zona 4 relay"
    restore_mode: ALWAYS_OFF
    inverted: ${relay_inverted}
    icon: "mdi:electric-switch"
    on_turn_on:
      - logger.log: "Zona 4: relay ON"
    on_turn_off:
      - logger.log: "Zona 4: relay OFF"

  - platform: template
    name: "${dev_name} zona 4 activa"
    id: activa_z4
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    icon: "mdi:toggle-switch"
    turn_on_action:
      - logger.log: "Zona 4 habilitada"
      - script.execute: verificar_zonas
    turn_off_action:
      - script.stop: ejecutar_z4
      - switch.turn_off: forzado_z4
      - switch.turn_off: relay_z4
      - lambda: 'id(g_pending4) = false;'
      - logger.log: "Zona 4 deshabilitada"

  - platform: template
    name: "${dev_name} zona 4 forzado manual"
    id: forzado_z4
    optimistic: true
    restore_mode: ALWAYS_OFF
    icon: "mdi:hand-back-right"
    turn_on_action:
      - script.stop: ejecutar_z4
      - switch.turn_on: relay_z4
      - logger.log: "Zona 4 forzado manual ON"
    turn_off_action:
      - script.stop: ejecutar_z4
      - switch.turn_off: relay_z4
      - logger.log: "Zona 4 forzado manual OFF"

  # ---- Programador general ----
  - platform: template
    name: "${dev_name} programador activo"
    id: programador_activo
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    icon: "mdi:calendar-check"
    turn_on_action:
      - logger.log: "Programador ACTIVADO"
      - script.execute: verificar_zonas
    turn_off_action:
      - logger.log: "Programador DESACTIVADO"
      - script.stop: ejecutar_z1
      - script.stop: ejecutar_z2
      - script.stop: ejecutar_z3
      - script.stop: ejecutar_z4
      - lambda: |-
          id(g_pending1) = false;
          id(g_pending2) = false;
          id(g_pending3) = false;
          id(g_pending4) = false;
      - if:
          condition:
            switch.is_off: forzado_z1
          then:
            - switch.turn_off: relay_z1
      - if:
          condition:
            switch.is_off: forzado_z2
          then:
            - switch.turn_off: relay_z2
      - if:
          condition:
            switch.is_off: forzado_z3
          then:
            - switch.turn_off: relay_z3
      - if:
          condition:
            switch.is_off: forzado_z4
          then:
            - switch.turn_off: relay_z4

