# ===================================================================
# RIEGO CESPED - ESP32 + 4 ZONAS
# ===================================================================
# Controlador de riego para cesped con 4 electrovalvulas/reles.
#
# Cada zona tiene:
#   - switch "zona N activa"      -> habilita/deshabilita el riego automatico
#   - text   "zona N horario"     -> horas separadas por coma, ej "6,18,20"
#                                   (tambien acepta HH:MM, ej "6:30,18:00")
#   - number "zona N duracion min"-> minutos de riego por evento
#   - switch "zona N relay"       -> control manual directo de la valvula
#   - switch "zona N forzado manual" -> abre la valvula e ignora la rutina
#   - button "zona N accionar ahora" -> riego manual temporizado
#   - button "zona N detener"        -> corta el riego de la zona
#
# Las zonas programadas se ejecutan de a UNA por vez (secuencial): si varias
# zonas coinciden en el mismo horario, se encolan y arrancan cuando la
# anterior termina.
#
# Incluye: MQTT con prefijo dinamico (MAC), WiFi con AP de configuracion,
# portal cautivo, web_server, NTP + backup de hora, seteo manual de fecha/hora,
# OTA local (ESPHome) y OTA remoto por HTTP (app petraka).
# ===================================================================

substitutions:
  # 1. IDENTIDAD DEL DISPOSITIVO
  name: "riego_cesped"
  dev_name: "riego_cesped"
  friendly_name: "Riego Cesped"

  # 2. ZONA HORARIA
  zona_horaria: "America/Argentina/Buenos_Aires"

  # 3. SERVIDOR MQTT
  mqtt_host: "mqtt.petraka.com.ar"
  mqtt_port: "1883"
  mqtt_user: "alejandro"
  mqtt_pass: "piteroski1984"

  # 4. PINES DE RELES (ESP32)
  #    GPIO25/23/22/21 son salidas seguras en esp32dev (sin strapping).
  pin_r1: "25"
  pin_r2: "23"
  pin_r3: "22"
  pin_r4: "21"

  # Modulos de rele activos en bajo -> poner "true".
  relay_inverted: "false"

  # 5. VALORES POR DEFECTO
  duracion_default: "10"
  horario_default: "6,18"

  # Version de firmware reportada por MQTT.
  fw_version: "1.0.0"

# ===================================================================
# PREFERENCIAS / PERSISTENCIA
# ===================================================================
preferences:
  flash_write_interval: 10s

# ===================================================================
# CONFIGURACION BASICA DEL ESP32
# ===================================================================
esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  name_add_mac_suffix: true

  on_boot:
    - priority: 600.0
      then:
        - lambda: |-
            uint32_t ep = id(g_last_epoch);
            if (ep > 1500000000) {
              struct timeval tv{};
              tv.tv_sec = static_cast<time_t>(ep);
              tv.tv_usec = 0;
              settimeofday(&tv, nullptr);
              ESP_LOGI("boot", "Hora restaurada de backup: %u", ep);
            } else {
              ESP_LOGW("boot", "Sin hora de backup previa (%u)", ep);
            }
    - priority: 950.0
      then:
        - lambda: |-
            std::string mac = get_mac_address();
            std::string suffix = mac.substr(mac.length() - 6);
            std::string prefix = std::string("${dev_name}-") + suffix;
            if (global_mqtt_client != nullptr) {
              global_mqtt_client->set_topic_prefix(prefix, "");
              global_mqtt_client->set_birth_message({prefix + "/status", "online", 0, true});
              global_mqtt_client->set_last_will({prefix + "/status", "offline", 0, true});
              ESP_LOGI("mqtt", "Topic prefix dinamico: %s", prefix.c_str());
            }
    - priority: -100
      then:
        - text_sensor.template.publish:
            id: firmware_version
            state: "${fw_version}"
        - lambda: 'id(ota_status).publish_state("ok");'
        - script.execute: verificar_zonas

esp32:
  board: esp32dev
  framework:
    type: arduino

logger:
  level: INFO

debug:
  update_interval: 30s

http_request:
  timeout: 60s
  verify_ssl: false  # framework arduino -> HTTPS sin validacion de certificado

# OTA nativo ESPHome (LAN/serial) + OTA remoto por HTTP (app petraka)
ota:
  - platform: esphome
    password: "5c883c92e585defcc523fa7fba2f6930"
  - platform: http_request
    id: ota_http

web_server:
  port: 80

# ===================================================================
# CONECTIVIDAD
# ===================================================================
wifi:
  id: wifi_component
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none
  reboot_timeout: 0s
  on_connect:
    - mqtt.enable:
    - logger.log: "WiFi STA conectado; MQTT habilitado"
  on_disconnect:
    - mqtt.disable:
    - logger.log: "WiFi STA desconectado; MQTT deshabilitado"
  ap:
    # Sin ssid -> ESPHome usa el device name + sufijo MAC ("riego_cesped-<mac6>")
    password: "centenario123"
    ap_timeout: 20s
    manual_ip:
      static_ip: 192.168.4.1
      gateway: 192.168.4.1
      subnet: 255.255.255.0

captive_portal:

mqtt:
  id: mqtt_client
  broker: ${mqtt_host}
  port: ${mqtt_port}
  username: ${mqtt_user}
  password: ${mqtt_pass}
  topic_prefix: ${dev_name} # Se setea dinamicamente con el MAC en on_boot
  discovery: false
  keepalive: 120s
  # 0s: no reiniciar mientras esta en AP de configuracion sin acceso al broker.
  reboot_timeout: 0s

  on_connect:
    - logger.log: ">> CONEXION MQTT ESTABLECIDA <<"
    - component.update: reloj_sntp

time:
  - platform: sntp
    id: reloj_sntp
    timezone: ${zona_horaria}
    servers: [0.pool.ntp.org, 1.pool.ntp.org]
    on_time:
      # Cada minuto se evaluan los horarios de las 4 zonas.
      - seconds: 0
        then:
          - script.execute: verificar_zonas

# ===================================================================
# GLOBALS
# ===================================================================
globals:
  # Ultimo epoch valido: permite arrancar sin internet y conservar la hora.
  - id: g_last_epoch
    type: uint32_t
    restore_value: true
    initial_value: '0'

  # URL y MD5 del binario a instalar (los setea el handler MQTT de OTA).
  - id: ota_url
    type: std::string
    initial_value: '""'
  - id: ota_md5
    type: std::string
    initial_value: '""'

  # Clave del ultimo evento programado ya disparado por zona (evita repetir
  # el mismo horario dentro de la misma hora/minuto). Se persiste en flash.
  - id: g_last_key1
    type: uint32_t
    restore_value: true
    initial_value: '0'
  - id: g_last_key2
    type: uint32_t
    restore_value: true
    initial_value: '0'
  - id: g_last_key3
    type: uint32_t
    restore_value: true
    initial_value: '0'
  - id: g_last_key4
    type: uint32_t
    restore_value: true
    initial_value: '0'

  # Evento programado pendiente de ejecutar (cola secuencial). No se persiste.
  - id: g_pending1
    type: bool
    initial_value: 'false'
  - id: g_pending2
    type: bool
    initial_value: 'false'
  - id: g_pending3
    type: bool
    initial_value: 'false'
  - id: g_pending4
    type: bool
    initial_value: 'false'

# ===================================================================
# ESTADO (TEXT SENSORS)
# ===================================================================
text_sensor:
  - platform: template
    name: "${dev_name} hora actual"
    id: hora_actual_txt
    update_interval: 10s
    icon: "mdi:clock-outline"
    lambda: |-
      auto tt = id(reloj_sntp).now();
      if (!tt.is_valid()) return {"--:--:--"};
      return {tt.strftime("%Y-%m-%d %H:%M:%S")};

  - platform: template
    name: "${dev_name} device id"
    id: device_id
    update_interval: 5min
    icon: "mdi:identifier"
    lambda: |-
      std::string mac = get_mac_address();
      std::string suffix = mac.substr(mac.length() - 6);
      char buf[20];
      snprintf(buf, sizeof(buf), "RC-%s", suffix.c_str());
      return {std::string(buf)};

  - platform: template
    name: "${dev_name} zona 1 estado"
    id: estado_z1
    update_interval: 10s
    icon: "mdi:sprinkler-variant"
    lambda: |-
      if (!id(activa_z1).state) return {"deshabilitada"};
      if (id(forzado_z1).state) return {"forzado"};
      if (id(relay_z1).state) return {"regando"};
      return {"esperando"};

  - platform: template
    name: "${dev_name} zona 2 estado"
    id: estado_z2
    update_interval: 10s
    icon: "mdi:sprinkler-variant"
    lambda: |-
      if (!id(activa_z2).state) return {"deshabilitada"};
      if (id(forzado_z2).state) return {"forzado"};
      if (id(relay_z2).state) return {"regando"};
      return {"esperando"};

  - platform: template
    name: "${dev_name} zona 3 estado"
    id: estado_z3
    update_interval: 10s
    icon: "mdi:sprinkler-variant"
    lambda: |-
      if (!id(activa_z3).state) return {"deshabilitada"};
      if (id(forzado_z3).state) return {"forzado"};
      if (id(relay_z3).state) return {"regando"};
      return {"esperando"};

  - platform: template
    name: "${dev_name} zona 4 estado"
    id: estado_z4
    update_interval: 10s
    icon: "mdi:sprinkler-variant"
    lambda: |-
      if (!id(activa_z4).state) return {"deshabilitada"};
      if (id(forzado_z4).state) return {"forzado"};
      if (id(relay_z4).state) return {"regando"};
      return {"esperando"};

  # Version de firmware instalada (la lee la app como text_sensor_firmware_version)
  - platform: template
    name: "firmware_version"
    id: firmware_version
    update_interval: 60s
    icon: "mdi:numeric-1-box-multiple-outline"
    lambda: 'return {"${fw_version}"};'

# ===================================================================
# OTA REMOTO (actualizacion de firmware desde la app)
# ===================================================================
# La app publica en: <prefijo>/text/ota_firmware/command con "URL|MD5".
# El device reporta en <prefijo>/text/ota_status/state
#   ("descargando" | "error: ..." | "ok").
text:
  - platform: template
    name: "ota_firmware"
    id: ota_firmware
    optimistic: true
    mode: text
    max_length: 255
    on_value:
      - lambda: |-
          std::string cmd = x;
          std::string url;
          std::string md5;
          size_t sep = cmd.find('|');
          if (sep == std::string::npos) {
            url = cmd;
          } else {
            url = cmd.substr(0, sep);
            md5 = cmd.substr(sep + 1);
          }
          if (url.rfind("http://", 0) != 0 && url.rfind("https://", 0) != 0) {
            id(ota_status).publish_state("error: URL invalida");
            ESP_LOGW("ota", "URL de OTA invalida: %.50s", url.c_str());
            return;
          }
          if (md5.size() != 32) {
            id(ota_status).publish_state("error: MD5 invalido");
            ESP_LOGW("ota", "MD5 de OTA invalido (len=%u)", (unsigned) md5.size());
            return;
          }
          id(ota_url) = url;
          id(ota_md5) = md5;
          id(ota_status).publish_state("descargando");
          ESP_LOGI("ota", "OTA solicitado desde %s", url.c_str());
      - ota.http_request.flash:
          id: ota_http
          url: !lambda 'return id(ota_url);'
          md5: !lambda 'return id(ota_md5);'
      # Si llegamos aca fue porque el flash fallo (si tiene exito, reinicia).
      - lambda: 'id(ota_status).publish_state("error: flash fallo");'

  - platform: template
    name: "ota_status"
    id: ota_status
    optimistic: true
    mode: text
    max_length: 64

  # ---- Horarios por zona (horas separadas por coma) ----
  - platform: template
    name: "${dev_name} zona 1 horario"
    id: horario_z1
    optimistic: true
    restore_value: true
    mode: text
    max_length: 64
    initial_value: "${horario_default}"
    icon: "mdi:calendar-clock"
    on_value:
      - script.execute: verificar_zonas

  - platform: template
    name: "${dev_name} zona 2 horario"
    id: horario_z2
    optimistic: true
    restore_value: true
    mode: text
    max_length: 64
    initial_value: "${horario_default}"
    icon: "mdi:calendar-clock"
    on_value:
      - script.execute: verificar_zonas

  - platform: template
    name: "${dev_name} zona 3 horario"
    id: horario_z3
    optimistic: true
    restore_value: true
    mode: text
    max_length: 64
    initial_value: "${horario_default}"
    icon: "mdi:calendar-clock"
    on_value:
      - script.execute: verificar_zonas

  - platform: template
    name: "${dev_name} zona 4 horario"
    id: horario_z4
    optimistic: true
    restore_value: true
    mode: text
    max_length: 64
    initial_value: "${horario_default}"
    icon: "mdi:calendar-clock"
    on_value:
      - script.execute: verificar_zonas

# ===================================================================
# SETEADOR MANUAL DE FECHA/HORA (fallback NTP)
# ===================================================================
datetime:
  - platform: template
    type: DATETIME
    name: "${dev_name} config fecha hora"
    id: dt_manual
    time_id: reloj_sntp
    lambda: |-
      auto tt = id(reloj_sntp).now();
      if (!tt.is_valid()) return {};
      return tt;
    set_action:
      - lambda: |-
          ESPTime val = x;
          val.recalc_timestamp_local();
          time_t epoch = val.timestamp;
          if (epoch == (time_t) -1) {
            ESP_LOGW("dt", "Fecha/hora invalida, no aplicada");
            return;
          }
          struct timeval tv{};
          tv.tv_sec = epoch;
          tv.tv_usec = 0;
          settimeofday(&tv, nullptr);
          ESP_LOGI("dt", "Hora manual aplicada epoch=%ld", (long) epoch);
          id(hora_actual_txt).publish_state(val.strftime("%Y-%m-%d %H:%M:%S"));

# ===================================================================
# DURACION POR ZONA (NUMBERS)
# ===================================================================
number:
  - platform: template
    name: "${dev_name} zona 1 duracion min"
    id: duracion_z1
    optimistic: true
    min_value: 1
    max_value: 120
    step: 1
    initial_value: ${duracion_default}
    restore_value: true
    unit_of_measurement: "min"
    icon: "mdi:timer-outline"

  - platform: template
    name: "${dev_name} zona 2 duracion min"
    id: duracion_z2
    optimistic: true
    min_value: 1
    max_value: 120
    step: 1
    initial_value: ${duracion_default}
    restore_value: true
    unit_of_measurement: "min"
    icon: "mdi:timer-outline"

  - platform: template
    name: "${dev_name} zona 3 duracion min"
    id: duracion_z3
    optimistic: true
    min_value: 1
    max_value: 120
    step: 1
    initial_value: ${duracion_default}
    restore_value: true
    unit_of_measurement: "min"
    icon: "mdi:timer-outline"

  - platform: template
    name: "${dev_name} zona 4 duracion min"
    id: duracion_z4
    optimistic: true
    min_value: 1
    max_value: 120
    step: 1
    initial_value: ${duracion_default}
    restore_value: true
